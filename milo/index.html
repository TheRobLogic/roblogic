<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --dusk: #241539;        /* page ground — warm deep purple */
  --dusk-deep: #150c26;   /* lower dusk */
  --dusk-glow: #382055;   /* warmth behind the headline */
  --lavender: #cfc3e8;    /* his collar */
  --moon: #f4f0fc;        /* headline */
  --rust: #d9a05b;        /* his markings, and that morning light */
  --paw: 207, 195, 232;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Karla', sans-serif;
  font-weight: 300;
  color: var(--lavender);
  background:
    radial-gradient(ellipse 140% 85% at 50% -12%, rgba(56, 32, 85, 0.95) 0%, rgba(48, 28, 74, 0.45) 38%, rgba(56, 32, 85, 0) 72%),
    linear-gradient(180deg, var(--dusk) 0%, #1c1030 60%, var(--dusk-deep) 100%);
  background-color: var(--dusk);
  min-height: 100vh;
  overflow-x: hidden;
  text-align: center;
}

/* dusk air — grain + vignette */
.grain, .vignette { position: fixed; inset: 0; pointer-events: none; }
.grain {
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.035;
  mix-blend-mode: overlay;
  z-index: 2;
}
.vignette {
  background: radial-gradient(ellipse at center, transparent 55%, rgba(10, 5, 20, 0.4) 100%);
  z-index: 1;
}

main { position: relative; z-index: 3; }

/* ————— hero ————— */
.hero {
  position: relative;
  min-height: 88vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 1rem 3rem;
}

.eyebrow {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1.15rem, 3.4vw, 1.7rem);
  letter-spacing: 0.04em;
  color: var(--lavender);
  animation: rise 1s cubic-bezier(0.22, 0.8, 0.32, 1) both 0.2s;
}

.name {
  font-family: 'Fraunces', serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-size: clamp(4.6rem, 19vw, 10rem);
  line-height: 1.02;
  letter-spacing: 0.01em;
  color: var(--moon);
  text-shadow: 0 0 60px rgba(120, 86, 190, 0.35);
  margin: 0.4rem 0 0.9rem;
  animation: rise 1.1s cubic-bezier(0.22, 0.8, 0.32, 1) both 0.5s;
}

.dates {
  font-size: clamp(0.95rem, 2.6vw, 1.2rem);
  font-weight: 400;
  letter-spacing: 0.38em;
  text-indent: 0.38em; /* balance the tracking */
  color: var(--rust);
  animation: rise 1s cubic-bezier(0.22, 0.8, 0.32, 1) both 0.95s;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ————— the paw trails —————
   two trails walk up either side of his name, left and right feet
   alternating like a real gait, dissolving as they climb */
.print {
  position: absolute;
  width: calc(clamp(30px, 6vw, 56px) * var(--s));
  opacity: var(--op);
  fill: rgb(var(--paw));
  transform: var(--tr);
  animation: step 0.9s cubic-bezier(0.22, 0.8, 0.32, 1) both;
  animation-delay: var(--d);
}
.print-l { left: var(--x); top: var(--y); }
.print-r { right: var(--x); top: var(--y); }

@keyframes step {
  from { opacity: 0; transform: var(--tr) translateY(16px) scale(0.82); }
  to   { opacity: var(--op); transform: var(--tr); }
}

/* ————— his portrait, above the name in the hero —————
   the text arrives first; he appears above it, last */
.hero-portrait {
  margin-bottom: 2.4rem;
  animation: rise 1.4s cubic-bezier(0.22, 0.8, 0.32, 1) both 1.8s;
}

.hero-portrait img {
  display: block;
  width: min(84vw, 340px);
  height: auto;
  border-radius: 12px;
  border: 1px solid rgba(207, 195, 232, 0.22);
  padding: 9px;
  background: rgba(244, 240, 252, 0.04);
  box-shadow:
    0 26px 70px -20px rgba(0, 0, 0, 0.65),
    0 0 90px rgba(120, 86, 190, 0.16);
}

/* ————— tribute ————— */
.portrait {
  padding: 2.5rem 1.5rem 4.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.tribute {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: clamp(1.2rem, 3.6vw, 1.55rem);
  line-height: 1.55;
  max-width: 30ch;
  color: var(--moon);
  animation: rise 1.2s cubic-bezier(0.22, 0.8, 0.32, 1) both 2.3s;
}
.tribute span { display: block; }

/* ————— gallery ————— */
.gallery {
  padding: 3.5rem 1.5rem 4rem;
  max-width: 980px;
  margin: 0 auto;
}

.gallery h2 {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: clamp(1.5rem, 4.5vw, 2rem);
  color: var(--moon);
}

.gallery h2::after {
  content: '';
  display: block;
  width: 46px;
  height: 2px;
  background: var(--rust);
  margin: 0.9rem auto 0;
  opacity: 0.7;
}

.grid {
  margin-top: 2.6rem;
  columns: 3 220px;
  column-gap: 16px;
  text-align: left;
}
.grid figure { break-inside: avoid; margin-bottom: 16px; }
.grid a { display: block; }
.grid a:hover img, .grid a:focus-visible img {
  border-color: rgba(217, 160, 91, 0.55);
  transform: translateY(-2px);
}
.grid a:focus-visible { outline: 2px solid var(--rust); outline-offset: 3px; border-radius: 10px; }
.grid img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;
  border: 1px solid rgba(207, 195, 232, 0.16);
  transition: border-color 0.25s, transform 0.25s;
}
.grid figcaption {
  font-size: 0.8rem;
  font-style: italic;
  color: rgba(207, 195, 232, 0.55);
  margin-top: 0.4rem;
}
.grid:empty { display: none; }
.grid a { cursor: zoom-in; }

/* video tiles — poster + play badge */
.vidtile a { position: relative; }
.play {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.play::before {
  content: '';
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: rgba(21, 12, 38, 0.62);
  border: 1.5px solid rgba(207, 195, 232, 0.65);
  box-shadow: 0 4px 22px rgba(0, 0, 0, 0.45);
}
.play::after {
  content: '';
  position: absolute;
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 12px 0 12px 20px;
  border-color: transparent transparent transparent var(--moon);
  margin-left: 5px;
}
.grid a:hover .play::before, .grid a:focus-visible .play::before {
  border-color: var(--rust);
  background: rgba(21, 12, 38, 0.78);
}

/* ————— lightbox — tap a photo to enlarge, tap again to come back ————— */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3vmin;
  background: rgba(13, 7, 25, 0.93);
  cursor: zoom-out;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.28s ease, visibility 0.28s;
  overscroll-behavior: contain;
}
.lightbox.open { opacity: 1; visibility: visible; }
.lightbox img {
  display: block;
  max-width: min(94vw, 1000px);
  max-height: 84vh;
  max-height: 84svh;
  width: auto;
  height: auto;
  border-radius: 10px;
  border: 1px solid rgba(207, 195, 232, 0.28);
  box-shadow: 0 30px 90px -20px rgba(0, 0, 0, 0.8), 0 0 110px rgba(120, 86, 190, 0.18);
}
.lightbox figcaption {
  margin-top: 0.7rem;
  font-size: 0.9rem;
  font-style: italic;
  color: rgba(207, 195, 232, 0.7);
}
.lightbox video {
  display: block;
  max-width: min(94vw, 1000px);
  max-height: 84vh;
  max-height: 84svh;
  width: auto;
  height: auto;
  border-radius: 10px;
  border: 1px solid rgba(207, 195, 232, 0.28);
  background: #000;
  box-shadow: 0 30px 90px -20px rgba(0, 0, 0, 0.8), 0 0 110px rgba(120, 86, 190, 0.18);
  cursor: default;
}
.lightbox [hidden] { display: none !important; }

/* ————— leave a paw ————— */
.pawbox {
  padding: 1.5rem 1.5rem 0.5rem;
}

.pawbtn {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  border: 1.5px solid rgba(207, 195, 232, 0.35);
  background: rgba(244, 240, 252, 0.05);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, border-color 0.25s, background 0.25s, box-shadow 0.25s;
}
.pawbtn svg { width: 34px; fill: rgba(207, 195, 232, 0.75); transition: fill 0.25s; }
.pawbtn:hover:not(.pressed) { transform: translateY(-2px); border-color: rgba(217, 160, 91, 0.6); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
.pawbtn:focus-visible { outline: 2px solid var(--rust); outline-offset: 4px; }
.pawbtn.pressed { background: rgba(217, 160, 91, 0.16); border-color: var(--rust); cursor: default; }
.pawbtn.pressed svg { fill: var(--rust); }
.pawbtn.pop { animation: pawpop 0.45s cubic-bezier(0.22, 0.8, 0.32, 1); }
@keyframes pawpop { 0% { transform: scale(1); } 35% { transform: scale(1.18); } 100% { transform: scale(1); } }

.paw-label { margin-top: 0.9rem; font-size: 0.95rem; color: rgba(207, 195, 232, 0.85); }
.paw-count {
  margin-top: 0.35rem;
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1.05rem;
  color: var(--rust);
  min-height: 1.4em;
}

/* ————— footer ————— */
footer {
  padding: 2rem 1.5rem 3.5rem;
}

.footpaw {
  width: 22px;
  fill: rgba(207, 195, 232, 0.35);
  margin: 1.4rem auto 1.1rem;
  display: block;
}

.site {
  font-size: 0.72rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(207, 195, 232, 0.38);
}

@media (max-width: 560px) {
  /* fit the whole composition inside the visual viewport with Safari's bars up */
  .hero { min-height: 82vh; min-height: 100svh; padding: 2.2rem 1rem 2.5rem; }
  .hero-portrait { margin-bottom: 1.5rem; }
  .hero-portrait img { width: min(62vw, 250px); padding: 7px; }
  .name { font-size: clamp(4rem, 18vw, 10rem); }
  .dates { font-size: 0.9rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}
</style>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged photo of Milo" tabindex="-1">
  <figure>
    <img id="lbImg" src="" alt="">
    <video id="lbVid" controls playsinline preload="none" hidden></video>
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<script>
(function () {
  var grid = document.querySelector('.grid');
  var box = document.getElementById('lightbox');
  var lbImg = document.getElementById('lbImg');
  var lbVid = document.getElementById('lbVid');
  var lbCap = document.getElementById('lbCap');
  var lastLink = null;
  var scrollY = 0;

  /* iOS Safari ignores body overflow:hidden — pin the body instead */
  function lockScroll() {
    scrollY = window.scrollY;
    document.body.style.position = 'fixed';
    document.body.style.top = -scrollY + 'px';
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    document.body.style.overflow = 'hidden';
  }
  function unlockScroll() {
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    document.body.style.overflow = '';
    document.documentElement.style.scrollBehavior = 'auto';
    window.scrollTo(0, scrollY);
    document.documentElement.style.scrollBehavior = '';
  }

  /* native controls take ~4s to auto-hide on mobile — hide them ourselves,
     sooner; any tap on the video brings them back */
  var ctrlTimer = null;
  function hideCtrlsSoon(delay) {
    clearTimeout(ctrlTimer);
    ctrlTimer = setTimeout(function () {
      if (!lbVid.paused && !lbVid.hidden) lbVid.removeAttribute('controls');
    }, delay);
  }
  lbVid.addEventListener('playing', function () { hideCtrlsSoon(1200); });
  lbVid.addEventListener('pause', function () {
    clearTimeout(ctrlTimer);
    lbVid.setAttribute('controls', '');
  });

  function openBox(a) {
    var img = a.querySelector('img');
    var cap = a.parentElement.querySelector('figcaption');
    var isVideo = a.hasAttribute('data-video');
    lbCap.textContent = cap ? cap.textContent : '';
    if (isVideo) {
      lbImg.hidden = true;
      lbImg.src = '';
      lbVid.hidden = false;
      lbVid.setAttribute('controls', '');
      lbVid.src = a.href;
      lbVid.play();
    } else {
      stopVideo();
      lbVid.hidden = true;
      lbImg.hidden = false;
      lbImg.src = a.href;
      lbImg.alt = img ? img.alt : '';
    }
    box.classList.add('open');
    lockScroll();
    lastLink = a;
    box.focus();
  }
  function stopVideo() {
    clearTimeout(ctrlTimer);
    if (!lbVid.hidden) {
      lbVid.pause();
      lbVid.removeAttribute('src');
      lbVid.load();
      lbVid.setAttribute('controls', '');
    }
  }
  function closeBox() {
    box.classList.remove('open');
    stopVideo();
    unlockScroll();
    if (lastLink) { try { lastLink.focus({preventScroll: true}); } catch (e) { lastLink.focus(); } lastLink = null; }
  }

  grid.addEventListener('click', function (e) {
    var a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    openBox(a);
  });
  box.addEventListener('click', function (e) {
    if (e.target === lbVid) {
      /* tap on the video: bring controls back, never close */
      if (!lbVid.hasAttribute('controls')) {
        lbVid.setAttribute('controls', '');
        if (!lbVid.paused) hideCtrlsSoon(2500);
      }
      return;
    }
    closeBox();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && box.classList.contains('open')) closeBox();
  });
})();
</script>

<script>
(function () {
  var API = '/milo/api/paw';
  var btn = document.getElementById('pawBtn');
  var label = document.getElementById('pawLabel');
  var countEl = document.getElementById('pawCount');

  function showCount(n) {
    if (typeof n === 'number' && n > 0) {
      countEl.textContent = n === 1 ? 'one paw left for Milo' : n + ' paws left for Milo';
    }
  }
  function setPressed() {
    btn.classList.add('pressed');
    btn.setAttribute('aria-pressed', 'true');
    label.textContent = 'You left a paw for Milo.';
  }

  if (localStorage.getItem('milo-pawed') === '1') setPressed();

  fetch(API).then(function (r) { return r.json(); }).then(function (d) { showCount(d.count); }).catch(function () {});

  btn.addEventListener('click', function () {
    if (btn.classList.contains('pressed')) return;
    setPressed();
    btn.classList.add('pop');
    try { localStorage.setItem('milo-pawed', '1'); } catch (e) {}
    fetch(API, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) { showCount(d.count); })
      .catch(function () {});
  });
})();
</script>
