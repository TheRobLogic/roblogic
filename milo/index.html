<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --dusk: #241539;        /* page ground — warm deep purple */
  --dusk-deep: #150c26;   /* lower dusk */
  --dusk-glow: #382055;   /* warmth behind the headline */
  --lavender: #cfc3e8;    /* his collar */
  --moon: #f4f0fc;        /* headline */
  --rust: #d9a05b;        /* his markings, and that morning light */
  --paw: 207, 195, 232;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Karla', sans-serif;
  font-weight: 300;
  color: var(--lavender);
  background:
    radial-gradient(ellipse 140% 85% at 50% -12%, rgba(56, 32, 85, 0.95) 0%, rgba(48, 28, 74, 0.45) 38%, rgba(56, 32, 85, 0) 72%),
    linear-gradient(180deg, var(--dusk) 0%, #1c1030 60%, var(--dusk-deep) 100%);
  background-color: var(--dusk);
  min-height: 100vh;
  overflow-x: hidden;
  text-align: center;
}

/* dusk air — grain + vignette */
.grain, .vignette { position: fixed; inset: 0; pointer-events: none; }
.grain {
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  opacity: 0.035;
  mix-blend-mode: overlay;
  z-index: 2;
}
.vignette {
  background: radial-gradient(ellipse at center, transparent 55%, rgba(10, 5, 20, 0.4) 100%);
  z-index: 1;
}

main { position: relative; z-index: 3; }

/* ————— hero ————— */
.hero {
  position: relative;
  min-height: 88vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4rem 1rem 3rem;
}

.eyebrow {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1.15rem, 3.4vw, 1.7rem);
  letter-spacing: 0.04em;
  color: var(--lavender);
  animation: rise 1s cubic-bezier(0.22, 0.8, 0.32, 1) both 0.2s;
}

.name {
  font-family: 'Fraunces', serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-size: clamp(4.6rem, 19vw, 10rem);
  line-height: 1.02;
  letter-spacing: 0.01em;
  color: var(--moon);
  text-shadow: 0 0 60px rgba(120, 86, 190, 0.35);
  margin: 0.4rem 0 0.9rem;
  animation: rise 1.1s cubic-bezier(0.22, 0.8, 0.32, 1) both 0.5s;
}

.dates {
  font-size: clamp(0.95rem, 2.6vw, 1.2rem);
  font-weight: 400;
  letter-spacing: 0.38em;
  text-indent: 0.38em; /* balance the tracking */
  color: var(--rust);
  animation: rise 1s cubic-bezier(0.22, 0.8, 0.32, 1) both 0.95s;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(22px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ————— the paw trails —————
   two trails walk up either side of his name, left and right feet
   alternating like a real gait, dissolving as they climb */
.print {
  position: absolute;
  width: calc(clamp(30px, 6vw, 56px) * var(--s));
  opacity: var(--op);
  fill: rgb(var(--paw));
  transform: var(--tr);
  animation: step 0.9s cubic-bezier(0.22, 0.8, 0.32, 1) both;
  animation-delay: var(--d);
}
.print-l { left: var(--x); top: var(--y); }
.print-r { right: var(--x); top: var(--y); }

@keyframes step {
  from { opacity: 0; transform: var(--tr) translateY(16px) scale(0.82); }
  to   { opacity: var(--op); transform: var(--tr); }
}

/* ————— portrait ————— */
.portrait {
  padding: 2.5rem 1.5rem 4.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.2rem;
}

.portrait figure {
  animation: rise 1.2s cubic-bezier(0.22, 0.8, 0.32, 1) both 1.5s;
}

.portrait img {
  display: block;
  width: min(84vw, 340px);
  height: auto;
  border-radius: 12px;
  border: 1px solid rgba(207, 195, 232, 0.22);
  padding: 9px;
  background: rgba(244, 240, 252, 0.04);
  box-shadow:
    0 26px 70px -20px rgba(0, 0, 0, 0.65),
    0 0 90px rgba(120, 86, 190, 0.16);
}

.portrait figcaption {
  margin-top: 0.9rem;
  font-style: italic;
  font-size: 0.9rem;
  color: rgba(207, 195, 232, 0.62);
}

.tribute {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: clamp(1.2rem, 3.6vw, 1.55rem);
  line-height: 1.55;
  max-width: 30ch;
  color: var(--moon);
  animation: rise 1.2s cubic-bezier(0.22, 0.8, 0.32, 1) both 1.8s;
}
.tribute span { display: block; }

/* ————— gallery ————— */
.gallery {
  padding: 3.5rem 1.5rem 4rem;
  max-width: 980px;
  margin: 0 auto;
}

.gallery h2 {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: clamp(1.5rem, 4.5vw, 2rem);
  color: var(--moon);
}

.gallery h2::after {
  content: '';
  display: block;
  width: 46px;
  height: 2px;
  background: var(--rust);
  margin: 0.9rem auto 0;
  opacity: 0.7;
}

.grid {
  margin-top: 2.6rem;
  columns: 3 220px;
  column-gap: 16px;
  text-align: left;
}
.grid figure { break-inside: avoid; margin-bottom: 16px; }
.grid a { display: block; }
.grid a:hover img, .grid a:focus-visible img {
  border-color: rgba(217, 160, 91, 0.55);
  transform: translateY(-2px);
}
.grid a:focus-visible { outline: 2px solid var(--rust); outline-offset: 3px; border-radius: 10px; }
.grid img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;
  border: 1px solid rgba(207, 195, 232, 0.16);
  transition: border-color 0.25s, transform 0.25s;
}
.grid figcaption {
  font-size: 0.8rem;
  font-style: italic;
  color: rgba(207, 195, 232, 0.55);
  margin-top: 0.4rem;
}
.grid:empty { display: none; }

/* ————— footer ————— */
footer {
  padding: 2rem 1.5rem 3.5rem;
}

.footpaw {
  width: 22px;
  fill: rgba(207, 195, 232, 0.35);
  margin: 1.4rem auto 1.1rem;
  display: block;
}

.site {
  font-size: 0.72rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: rgba(207, 195, 232, 0.38);
}

@media (max-width: 560px) {
  .hero { min-height: 82vh; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}
</style>
</head>

<main>

  <section class="hero" aria-label="In loving memory of Milo, 2014 to 2026">
    <!-- left trail — bottom to top, dissolving as it climbs -->
    <svg class="print print-l" style="--x:15%; --y:76%; --s:1;    --tr:rotate(-6deg);  --op:.42; --d:1.15s" aria-hidden="true"><use href="#paw"/></svg>
    <svg class="print print-l" style="--x:8%;  --y:60%; --s:.92;  --tr:rotate(-15deg); --op:.34; --d:1.45s" aria-hidden="true"><use href="#paw"/></svg>
    <svg class="print print-l" style="--x:14%; --y:44%; --s:.84;  --tr:rotate(-4deg);  --op:.26; --d:1.75s" aria-hidden="true"><use href="#paw"/></svg>
    <svg class="print print-l" style="--x:7%;  --y:29%; --s:.76;  --tr:rotate(-17deg); --op:.18; --d:2.05s" aria-hidden="true"><use href="#paw"/></svg>
    <svg class="print print-l" style="--x:12%; --y:14%; --s:.68;  --tr:rotate(-9deg);  --op:.11; --d:2.35s" aria-hidden="true"><use href="#paw"/></svg>

    <svg class="print print-r" style="--x:15%; --y:71%; --s:1;    --tr:scaleX(-1) rotate(-6deg);  --op:.42; --d:1.3s"  aria-hidden="true"><use href="#paw"/></svg>
    <svg class="print print-r" style="--x:8%;  --y:55%; --s:.92;  --tr:scaleX(-1) rotate(-15deg); --op:.34; --d:1.6s"  aria-hidden="true"><use href="#paw"/></svg>
    <svg class="print print-r" style="--x:14%; --y:39%; --s:.84;  --tr:scaleX(-1) rotate(-4deg);  --op:.26; --d:1.9s"  aria-hidden="true"><use href="#paw"/></svg>
    <svg class="print print-r" style="--x:7%;  --y:24%; --s:.76;  --tr:scaleX(-1) rotate(-17deg); --op:.18; --d:2.2s"  aria-hidden="true"><use href="#paw"/></svg>

    <p class="tribute"><span>A great dog. The fastest in the park.</span> <span>Missed more than words can say.</span></p>
