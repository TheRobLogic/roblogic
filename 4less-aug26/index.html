    const multi = g.count>1;
    const lotline = multi ? ('LOT '+esc(g.rangeLabel)+' · ×'+g.count) : ('LOT #'+esc(g.lotNums[0]));
    const take = g.honest_rec ? `<div class="take"><span class="pill ${PILL(g.verdict)}">${esc(g.verdict)}</span><span>${esc(g.honest_rec)}</span></div>` : '';
    const firstUrl = g.members[0] ? g.members[0].url : '#';
    const members = multi ? `<div class="members">${g.members.map(m=>`<a href="${esc(m.url)}" target="_blank" rel="noopener">#${esc(m.lotNum)}</a>`).join('')}</div>` : '';
    const foot = multi
      ? `<div class="foot"><button class="expand">▸ view ${g.count} lots</button><a href="${esc(firstUrl)}" target="_blank" rel="noopener">open ↗</a></div>`
      : `<div class="foot"><a href="${esc(firstUrl)}" target="_blank" rel="noopener">view lot ↗</a></div>`;
    const flag = g.watch ? '<span class="flag watch">● WATCHING</span>'
               : (g.pick ? '<span class="flag pick">◆ PICK</span>' : '');
    return `<div class="card${g.watch?' watch':''}">
      <a class="thumb" href="${esc(firstUrl)}" target="_blank" rel="noopener">
        <img loading="lazy" src="${esc(g.image)}" alt="${esc(g.title)}" onerror="this.onerror=null;this.src='${FALLBACK}'">
        ${multi?`<span class="badge">×${g.count}</span>`:''}
        ${flag}
        ${LIVE?`<span class="bidbadge${g.bidCount?'':' none'}">${g.bidCount?('$'+g.bidHigh):'—'}</span>`:''}
      </a>
      <div class="body">
        <div class="cat">${esc(g.category)}</div>
        <div class="ttl"><a href="${esc(firstUrl)}" target="_blank" rel="noopener">${esc(g.title)}</a></div>
        <div class="lotline">${lotline}</div>
        ${LIVE?`<div class="bidline${g.bidCount?'':' none'}">${g.bidCount?'💰':''} ${esc(bidText(g))}${g.bidCount?' <span class="lab">current</span>':''}</div>`:''}
        ${g.blurb?`<div class="blurb">${esc(g.blurb)}</div>`:''}
        ${take}
        ${foot}
        ${members}
      </div>
    </div>`;
  }

  function passes(g){
    if(activeCats.size && !activeCats.has(g.category)) return false;
    if(activeVerdicts.size && !activeVerdicts.has(g.verdict)) return false;
    const term=q.value.trim().toLowerCase();
    if(term){ const hay=(g.title+' '+(g.blurb||'')+' '+(g.description||'')+' '+(g.honest_rec||'')+' '+g.lotNums.join(' ')).toLowerCase();
      return term.split(/\s+/).every(w=>hay.includes(w)); }
    return true;
  }

  function sortView(arr){
    const m=sortSel.value, a=arr.slice();
    const cmp = {
      foryou:(x,y)=> y.interest_score-x.interest_score || x.title.localeCompare(y.title),
      bid:(x,y)=> (y.bidHigh||0)-(x.bidHigh||0) || y.interest_score-x.interest_score,
      lot:(x,y)=> minLot(x)-minLot(y),
      verdict:(x,y)=> (VORDER[x.verdict]-VORDER[y.verdict]) || y.interest_score-x.interest_score,
      count:(x,y)=> y.count-x.count || y.interest_score-x.interest_score,
      az:(x,y)=> x.title.localeCompare(y.title),
    }[m];
    a.sort((x,y)=> ((y.watch?1:0)-(x.watch?1:0)) || ((y.pick?1:0)-(x.pick?1:0)) || cmp(x,y));   // watching first, then picks, then sort
    return a;
  }

  function rebuild(){
    view=sortView(GROUPS.filter(passes));
    shown=0; grid.innerHTML='';
    emptyEl.hidden=view.length>0;
    const items=view.length, lots=view.reduce((s,g)=>s+g.count,0);
    countEl.textContent = items.toLocaleString()+' items · '+lots.toLocaleString()+' lots';
    more();
  }
  function more(){
    const next=view.slice(shown,shown+BATCH);
    grid.insertAdjacentHTML('beforeend', next.map(card).join(''));
    shown+=next.length;
  }
  grid.addEventListener('click',e=>{
    const b=e.target.closest('.expand'); if(!b) return;
    const mem=b.closest('.card').querySelector('.members');
    if(mem){ mem.classList.toggle('open'); b.textContent=(mem.classList.contains('open')?'▾ hide ':'▸ view ')+mem.children.length+' lots'; }
  });
  new IntersectionObserver(es=>{ if(es[0].isIntersecting && shown<view.length) more(); },{rootMargin:'800px'}).observe(document.getElementById('sentinel'));
  let t; q.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(rebuild,150);});
  sortSel.addEventListener('change',rebuild);
  rebuild();
</script>
</body>
</html>
