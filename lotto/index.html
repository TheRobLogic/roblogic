<style>
/* ================= TOKENS, l80 (live-page theme, round-5) ================= */
:root{
  color-scheme:light;
  --green:#00A651;--orange:#FF6A13;--yellow:#FFD400;--red:#D7263D;
  --paper:#FBF6E9;--ink:#111111;
  --muted:rgba(17,17,17,.74);--faint:rgba(17,17,17,.55);
  --line:rgba(17,17,17,.30);
  --green-bright:#00A651;
  --serif:"Lora",Georgia,serif;
  --sans:"Oswald",Helvetica,Arial,sans-serif;
  --display-font:var(--serif);--body-font:var(--serif);--num-font:var(--sans);
  --draw-serif:var(--serif);--draw-sans:var(--sans);
  --shadow-hard:6px 6px 0 var(--ink);
  --shadow-hard-l:8px 8px 0 var(--ink);
  --shadow-hard-s:4px 4px 0 var(--ink);
  --fs-base:18px;--fs-small:15.5px;--fs-rail:21px;
  --fs-view:40px;--fs-title:20px;--fs-reason:16.5px;
  --fs-stat:26px;--fw-stat:600;
  --rail-w:62px;--row-pad:24px;--row-gap:24px;
  --thumb-w:168px;--thumb-h:118px;
}

/* ================= BONES ================= */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scrollbar-gutter:stable}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body-font);font-weight:500;font-size:var(--fs-base);line-height:1.55;
  background-image:radial-gradient(rgba(17,17,17,.10) 1px,transparent 1.5px);
  background-size:14px 14px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
.num-fig{font-family:var(--num-font);font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}

/* ---------------- left rail (permanently collapsed strip) ---------------- */
.rail{
  width:var(--rail-w);flex:0 0 auto;
  position:sticky;top:var(--tb-h,96px);height:calc(100vh - var(--tb-h,96px));overflow:hidden;
  background:var(--paper);border-right:3px solid var(--ink);
  display:flex;flex-direction:column;z-index:40;
}
.rail-nav{padding:12px 0 16px;display:flex;flex-direction:column}
.nav-item{
  position:relative;display:flex;align-items:center;justify-content:center;
  height:52px;padding:0;white-space:nowrap;
  color:var(--muted);
  font-family:var(--sans);font-weight:700;font-size:var(--fs-rail);
  letter-spacing:.02em;text-transform:uppercase;
  font-variant-numeric:tabular-nums;
  transition:color 120ms ease,background 120ms ease;
}
.nav-item:hover{color:var(--ink);background:rgba(255,212,0,.32)}
.nav-item.active{
  color:var(--ink);background:var(--yellow);
  box-shadow:inset 5px 0 0 0 var(--ink);
}
.nav-dot{
  position:absolute;top:8px;right:8px;
  width:10px;height:10px;border-radius:50%;
  background:var(--green);border:2px solid var(--ink);
  opacity:1;transition:opacity 150ms ease;
}
.nav-dot.off{opacity:0}

/* ---------------- main pane ---------------- */
.main{flex:1 1 auto;min-width:0;transition:background 200ms ease}
body.on-draw .main{background:var(--paper)} /* flat paper on draw, hides dot grid, round-4 parity */
body.on-draw .rail{display:none}                 /* draw surface: no denom/game rail */
.shell{max-width:1100px;margin:0 auto;padding:0 40px 80px}

.topbar{
  position:sticky;top:0;z-index:50;background:var(--paper);
  background-image:radial-gradient(rgba(17,17,17,.10) 1px,transparent 1.5px);
  background-size:14px 14px;
  border-bottom:4px solid var(--ink);
  box-shadow:0 4px 0 rgba(17,17,17,.15);
}
.topbar-inner{
  max-width:1100px;margin:0 auto;padding:14px 40px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px 22px;
}
.brand{flex:0 1 auto;min-width:0}
.brand-inner{width:fit-content;max-width:100%}
.brand-logo-wrap{margin:0;line-height:0}
.brand-logo{display:block;width:400px;max-width:100%;height:auto}
.brand .dateline{margin-top:9px;text-align:center}
.surface-toggle{
  display:flex;align-items:stretch;border:3px solid var(--ink);flex:0 0 auto;
  background:var(--paper);box-shadow:var(--shadow-hard-s);
}
.surface-btn{
  padding:10px 24px 9px;font-family:var(--sans);font-size:16px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.surface-btn+.surface-btn,.surface-toggle .coffee-top{border-left:3px solid var(--ink)}
.surface-btn:hover{color:var(--ink)}
.surface-btn.active{background:var(--yellow);color:var(--ink)}
.dateline{
  font-family:var(--sans);font-weight:700;font-size:12.5px;color:var(--ink);
  letter-spacing:.18em;text-transform:uppercase;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.coffee-top{
  display:inline-flex;align-items:center;gap:7px;
  padding:10px 24px 9px;font-family:var(--sans);font-size:16px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:var(--paper);white-space:nowrap;
}
.coffee-top:hover{text-decoration:none;background:rgba(255,212,0,.32)}
.coffee-top .coffee-short{display:none}

/* ---------------- mode bar ---------------- */
.modebar{padding:26px 0 0}
.mode-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mode-btn{
  font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink);text-align:center;white-space:nowrap;
  background:var(--paper);border:3px solid var(--ink);
  padding:15px 12px 14px;box-shadow:var(--shadow-hard-s);
  transition:transform .08s ease,box-shadow .08s ease;
}
.mode-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.mode-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.mode-btn.active{background:var(--green);color:#fff}
.mode-blurb{
  margin:12px 0 0;font-family:var(--serif);font-style:italic;
  font-size:17px;color:var(--ink);text-align:center;
  background:#fff;border:3px solid var(--ink);box-shadow:var(--shadow-hard-s);
  padding:16px 20px 15px;
}

/* ---------------- scratcher sections (draw-card language) ---------------- */
.view-head{margin:40px 0 0}
.view-title{
  margin:0;font-family:var(--serif);font-style:italic;font-size:var(--fs-view);
  font-weight:700;letter-spacing:-.01em;line-height:1.16;
}
.view-title .hl{
  background-image:linear-gradient(180deg,transparent 60%,var(--yellow) 60%,var(--yellow) 94%,transparent 94%);
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
  padding:0 .1em;margin:0 -.1em;
}
.view-sub{margin:12px 0 0;font-style:italic;font-size:var(--fs-small);color:var(--muted);max-width:64ch}

/* card chrome cloned from the draw game cards */
.scard{
  margin-top:36px;border:3px solid var(--ink);
  background:#fff;box-shadow:var(--shadow-hard-l);
}
.scard-band{
  border-bottom:3px solid var(--ink);background:var(--green);color:#fff;
  padding:12px 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.scard.is-avoid .scard-band{background:var(--red)}
.scard-band h2{
  margin:0;font-family:var(--serif);font-style:italic;font-weight:700;
  font-size:24px;line-height:1.1;color:#fff;
}
.scard-band .scard-fig{
  margin-left:auto;font-family:var(--sans);font-weight:700;
  font-size:20px;letter-spacing:.06em;text-transform:uppercase;
  white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5;
}
.scard-body{padding:16px 20px 2px}
.scard-sub{
  margin:0;font-family:var(--sans);font-weight:700;font-size:15px;
  letter-spacing:.2em;text-transform:uppercase;line-height:1.5;
  display:flex;align-items:center;gap:10px;
}
.scard-sub::after{content:"";flex:1;border-top:2px dashed var(--ink);opacity:.25}
.scard-fine{
  font-family:var(--sans);font-weight:400;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:#666;border-top:2px solid var(--ink);
  padding:10px 20px;background:var(--paper);line-height:1.5;
  font-variant-numeric:tabular-nums;
}

.rows{display:flex;flex-direction:column}
.row{
  display:grid;
  grid-template-columns:var(--thumb-w) minmax(170px,230px) minmax(0,1fr) minmax(150px,max-content);
  grid-template-areas:"thumb head reason stat";
  gap:0 var(--row-gap);align-items:center;
  padding:var(--row-pad) 0;border-bottom:2px dashed var(--line);
}
.rows .row:last-child{border-bottom:0}
.row:hover{background:rgba(255,212,0,.16);box-shadow:0 0 0 10px rgba(255,212,0,.16)}
.thumb{
  grid-area:thumb;width:var(--thumb-w);height:var(--thumb-h);
  background:#fff;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb.err{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.thumb.err img{display:none}
.thumb.err::after{content:"no art"}
.row-head{grid-area:head;min-width:0;display:flex;align-items:center;gap:11px}
.row-title{font-size:var(--fs-title);font-weight:700;line-height:1.25;letter-spacing:-.005em;min-width:0}
.denom-bub{
  flex:0 0 auto;
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:50%;
  font-family:var(--sans);font-weight:700;font-size:14px;color:var(--ink);
  font-variant-numeric:tabular-nums;
  background:var(--paper);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);
}
.row-reason{grid-area:reason;font-size:var(--fs-reason);color:var(--muted);line-height:1.5;max-width:56ch}
.row.is-avoid .row-title{color:var(--muted)}
.row.is-avoid .thumb{opacity:.82}
.stat{grid-area:stat;text-align:right;justify-self:end;padding-left:14px}
.stat-v{
  font-family:var(--sans);font-size:var(--fs-stat);font-weight:var(--fw-stat);
  color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap;
}
.stat-none{color:var(--faint);font-weight:400}
.stat-l{margin-top:3px;font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.stat-s{margin-top:4px;font-family:var(--sans);font-weight:400;font-size:14px;letter-spacing:.02em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------------- draw surface (per peach.pit/lotto-draw-mockup) ---------------- */
.draw-hdr{margin-top:34px}
.draw-hdr .card{
  background:#fff;border:3px solid var(--ink);box-shadow:var(--shadow-hard-l);
  padding:20px 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
}
.draw-hdr h1{
  margin:0;font-family:var(--draw-serif);font-style:italic;font-weight:700;
  font-size:clamp(24px,4vw,33px);line-height:1.05;
}
.draw-hdr .sub{
  font-family:var(--draw-sans);font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;color:#555;
}
.draw-hdr .ddate{
  margin-left:auto;font-family:var(--draw-sans);font-size:13px;
  letter-spacing:.06em;text-transform:uppercase;
}
.games-grid{
  margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:34px 30px;
}
.game{
  position:relative;scroll-margin-top:120px;
  border:3px solid var(--ink);background:#fff;box-shadow:var(--shadow-hard-l);
}
.game .strip{
  border-bottom:3px solid var(--ink);
  padding:12px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.game .strip h2{
  margin:0;font-family:var(--draw-serif);font-style:italic;font-weight:700;
  font-size:24px;line-height:1.1;
}
.game .strip .jackpot{
  margin-left:auto;font-family:var(--draw-sans);font-weight:700;
  font-size:22px;letter-spacing:.02em;white-space:nowrap;
}
.game .gmeta{
  display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;
  padding:10px 18px;background:var(--paper);border-bottom:3px solid var(--ink);
  font-family:var(--draw-sans);font-weight:400;font-size:12.5px;
  letter-spacing:.06em;text-transform:uppercase;color:#555;
}
.game .gmeta b{color:var(--ink);font-weight:700}
.game .gmeta .g-cost{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.game.is-best .gmeta{padding-right:118px} /* clear the corner badge */
.game .gbody{padding:18px 18px 20px;display:grid;gap:18px}
.pick-block h4{
  margin:0 0 10px;font-family:var(--draw-sans);font-weight:700;font-size:15px;
  letter-spacing:.2em;text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.pick-block h4::after{content:"";flex:1;border-top:2px dashed var(--ink);opacity:.25}
.pick-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ball{
  display:inline-flex;align-items:center;justify-content:center;
  width:38px;height:38px;background:#fff;color:var(--ink);
  border:2px solid var(--ink);border-radius:50%;
  font-family:var(--draw-serif);font-weight:700;font-size:16px;
  box-shadow:2px 2px 0 var(--ink);
}
.plus{font-family:var(--draw-sans);font-weight:700;font-size:16px;opacity:.55;padding:0 2px}
.ball.special{color:#fff}
.special-tag{
  font-family:var(--draw-sans);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;opacity:.6;padding-left:4px;
}
.game[data-accent="green"]  .strip{background:var(--green-bright);color:#fff}
.game[data-accent="red"]    .strip{background:var(--red);color:#fff}
.game[data-accent="yellow"] .strip{background:var(--yellow);color:var(--ink)}
.game[data-accent="orange"] .strip{background:var(--orange);color:#fff}
.game[data-accent="green"]  .ball.special{background:var(--green-bright)}
.game[data-accent="red"]    .ball.special{background:var(--red)}
.game[data-accent="yellow"] .ball.special{background:var(--yellow);color:var(--ink)}
.game[data-accent="orange"] .ball.special{background:var(--orange)}
.game .window{
  font-family:var(--draw-sans);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:#666;border-top:2px solid var(--ink);
  padding:10px 18px;background:var(--paper);
}
.best-badge{
  position:absolute;top:-18px;right:10px;z-index:2;
  width:92px;height:92px;border-radius:50%;
  background:var(--yellow);border:3px solid var(--ink);
  box-shadow:var(--shadow-hard-s);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:rotate(-10deg);text-align:center;
  font-family:var(--draw-sans);font-weight:700;text-transform:uppercase;
}
.best-badge::before{
  content:"";position:absolute;inset:4px;border:2px dashed var(--ink);
  border-radius:50%;opacity:.55;
}
.best-badge .b1{font-size:13px;letter-spacing:.08em;line-height:1.05}
.best-badge .b2{font-size:9.5px;letter-spacing:.22em;margin-top:2px}
.game.is-best{box-shadow:var(--shadow-hard-l),0 0 0 6px var(--yellow)}
.game.is-best .strip{padding-right:118px}
.legend{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
.legend .box{
  border:3px solid var(--ink);background:#fff;box-shadow:var(--shadow-hard-s);
  padding:14px 16px;
}
.legend h5{
  margin:0 0 6px;font-family:var(--draw-sans);font-weight:700;font-size:13px;
  letter-spacing:.2em;text-transform:uppercase;
}
.legend p{margin:0;font-family:var(--draw-serif);font-size:14.5px;line-height:1.5}
.fine{margin-top:30px}
.fine .box{
  border:3px solid var(--ink);background:var(--ink);color:var(--paper);
  box-shadow:var(--shadow-hard-s);padding:16px 18px;
}
.fine h5{
  margin:0 0 6px;font-family:var(--draw-sans);font-weight:700;font-size:13px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--yellow);
}
.fine h5+p{margin-bottom:14px}
.fine p{margin:0;font-family:var(--draw-serif);font-size:14.5px;line-height:1.55;font-style:italic}

/* #5: collapse hot/due explainers + honesty fine print behind an "Info" expander */
.info-toggle{margin-top:30px}
.info-toggle>summary{
  list-style:none;cursor:pointer;width:fit-content;
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--draw-sans);font-weight:700;font-size:14px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  background:#fff;border:3px solid var(--ink);box-shadow:var(--shadow-hard-s);
  padding:11px 22px;line-height:1.2;
}
.info-toggle>summary::-webkit-details-marker{display:none}
.info-toggle>summary::after{content:"+";font-family:var(--draw-sans);font-size:18px;line-height:1}
.info-toggle[open]>summary::after{content:"\2013"}
.info-toggle>summary:hover{background:rgba(255,212,0,.32)}
.info-toggle .legend{margin-top:24px}

/* ---- r5 draw-surface guards: hold round-4 metrics under new body defaults (Lora 500 / lh 1.55) ---- */
.draw-hdr .sub,.draw-hdr .ddate,.game .window,.special-tag{font-weight:400}
.draw-hdr .sub,.draw-hdr .ddate,.game .window,.special-tag,
.pick-block h4,.game .strip .jackpot,.legend h5,.fine h5,.best-badge .b2{line-height:1.5}

/* ---------------- tip + footer ---------------- */
.tip{
  margin-top:56px;background:var(--green);color:#fff;
  border:3px solid var(--ink);box-shadow:var(--shadow-hard);
  padding:24px 26px;
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
}
.tip-line{font-family:var(--serif);font-style:italic;font-weight:700;font-size:24px;color:#fff}
.tip-btn{
  display:inline-block;font-family:var(--sans);font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;font-size:17px;
  color:var(--ink);background:var(--yellow);
  border:3px solid var(--ink);padding:13px 24px 11px;
  box-shadow:var(--shadow-hard-s);white-space:nowrap;
  transition:transform .08s ease,box-shadow .08s ease;
}
.tip-btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink);text-decoration:none;color:var(--ink)}
.tip-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tip-note{font-family:var(--sans);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow)}
footer{
  margin-top:44px;padding-top:20px;border-top:4px double var(--ink);
  text-align:center;font-family:var(--sans);font-weight:600;text-transform:uppercase;
  letter-spacing:.18em;font-size:13px;color:var(--ink);line-height:2;
}
footer .num-fig{font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;color:var(--green)}
.scratch-stripe{
  height:18px;margin-top:18px;border:3px solid var(--ink);
  background:repeating-linear-gradient(135deg,
    var(--orange) 0 14px,var(--ink) 14px 16px,
    var(--green) 16px 30px,var(--ink) 30px 32px,
    var(--yellow) 32px 46px,var(--ink) 46px 48px);
}
.rg-line{
  margin-top:14px;text-align:center;
  font-family:var(--sans);font-size:11px;letter-spacing:.04em;
  color:var(--muted);line-height:1.7;
}
.rg-line a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.rg-line a:hover{color:var(--ink)}

/* ================= RESPONSIVE ================= */
@media (max-width:900px){
  .shell,.topbar-inner{padding-left:26px;padding-right:26px}
  .games-grid,.legend{grid-template-columns:1fr;gap:26px}
  .mode-btns{grid-template-columns:1fr 1fr;gap:10px}
  :root{--fs-view:34px}
  .row{
    grid-template-columns:var(--thumb-w) minmax(0,1fr) max-content;
    grid-template-areas:"thumb head stat" "thumb reason reason";
    align-items:start;gap:4px var(--row-gap);
  }
  .row-reason{margin-top:6px}
}
@media (max-width:720px){
  :root{--fs-rail:15px;--pad:16px}
  /* uniform side gutter on every full-width band so all edges line up */
  .shell,.topbar-inner,.rail-nav{padding-left:var(--pad);padding-right:var(--pad)}
  /* unrail: the denom sidebar becomes a horizontal scroll strip and the
     content column goes full-width + centered (parity with the draw surface) */
  .app{flex-direction:column}
  .topbar{padding-left:0}
  .rail{
    width:auto;height:auto;flex:0 0 auto;
    position:static;overflow:visible;
    border-right:0;border-bottom:3px solid var(--ink);
  }
  .rail-nav{
    flex-direction:row;gap:8px;padding-top:10px;padding-bottom:10px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .rail-nav::-webkit-scrollbar{display:none}
  .nav-item{
    flex:0 0 auto;height:44px;min-width:50px;padding:0 15px;
    border:2px solid var(--ink);background:var(--paper);
  }
  .nav-item.active{background:var(--yellow);box-shadow:none}
  .nav-dot{top:5px;right:6px}
  /* topbar: logo stays left; toggle becomes a full-width segmented control */
  .topbar-inner{flex-direction:column;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
  .brand{order:1;min-width:0;max-width:100%}
  .brand-logo{width:300px}
  .brand .dateline{margin-top:7px}
  .surface-toggle{order:2;width:100%}
  .surface-btn,.surface-toggle .coffee-top{flex:1 1 0;justify-content:center;text-align:center}
  .surface-btn{padding:13px 10px;font-size:15px}
  .coffee-top{padding:13px 10px;font-size:15px}
  .coffee-top .coffee-full{display:none}
  .coffee-top .coffee-short{display:inline}
  .dateline{font-size:11px;letter-spacing:.14em;white-space:normal}
  .modebar{padding-top:20px}
  .mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode-btn{font-size:14px;padding:13px 8px 12px;text-align:center}
  .mode-blurb{font-size:15px}
  .view-head{margin-top:30px}
  .scard{margin-top:28px;box-shadow:var(--shadow-hard)}
  .scard-band{padding:10px 14px;gap:8px 12px;justify-content:center}
  .scard-band h2{font-size:20px}
  .scard-band .scard-fig{font-size:16px}
  .scard-body{padding:13px 14px 2px}
  .scard-sub{font-size:13px;letter-spacing:.14em}
  .scard-fine{padding:9px 14px}
  /* #2c: each pick card = vertical centered stack (image on top, all text centered below) */
  .row{
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
  }
  .thumb{order:1;width:100%;max-width:300px;height:auto;aspect-ratio:615 / 260}
  .thumb img{width:100%;height:100%;max-height:none;object-fit:cover}
  .row-head{order:2;justify-content:center;flex-wrap:wrap;gap:6px 11px}
  .row-title{text-align:center}
  .stat{order:3;justify-self:center;text-align:center;padding-left:0;margin-top:0}
  .stat-v{font-size:22px;display:inline}
  .stat-l{display:inline;margin-left:8px}
  .stat-s{display:block;margin-top:3px;white-space:normal}
  .row-reason{order:4;margin-top:0;max-width:46ch;text-align:center}
  .denom-bub{width:32px;height:32px;font-size:12px}
  .view-title{font-size:30px}
  .tip{margin-top:44px;padding:20px 16px}
  .tip-line{font-size:21px}
  .tip-btn{font-size:14px;padding:12px 16px 10px}
  .draw-hdr .ddate{margin-left:0}

function fmtJackpot(j){
  if(j==null) return "";
  if(j>=1e6){
    var m=j/1e6;
    var num=Number.isInteger(m)?m.toLocaleString("en-US"):m.toFixed(1);
    return "$"+num+" Million";
  }
  return "$"+j.toLocaleString("en-US",{maximumFractionDigits:0});
}

/* Rob 2026-06-11: explicit mode order + default, overrides JSON's default flag */
var MODE_ORDER = ["most_prizes","balanced","low_vol","high_vol"];
var state = {
  surface:"scratchers",
  mode:RAW.modes.some(function(m){return m.key===MODE_ORDER[0];}) ? MODE_ORDER[0]
       : (RAW.modes.find(function(m){return m.default;})||RAW.modes[0]).key,
  denom:"overall",
  game:(DRAW.games[0]||{}).game_id||null
};

/* frozen-row topbar: keep --tb-h in sync so the rail starts exactly under it */
(function(){
  var tb=document.querySelector(".topbar");
  function setTbH(){document.documentElement.style.setProperty("--tb-h",tb.getBoundingClientRect().height+"px")}

  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ---------- stat extraction (graceful when keys absent) ---------- */
function statFor(card, mode){
  if(mode==="low_vol" && card.breakeven_chance_pct){
    return {v:card.breakeven_chance_pct, l:"pay ≥ $"+card.price, s:null};
  }
  if(mode==="high_vol" && card.big_hit_odds){
    var s=null;
    if(card.top_prize) s=card.top_prize+" top"+(card.top_prize_remaining!=null?" · "+card.top_prize_remaining+" left":"");
    return {v:card.big_hit_odds, l:"big-hit odds", s:s};
  }
  if(mode==="balanced"){
    if(card.top_prize){
      var bits=[];
      if(card.top_prize_remaining!=null) bits.push(card.top_prize_remaining+" left");
      if(card.overall_odds) bits.push(card.overall_odds+" overall");
      return {v:card.top_prize, l:"top prize", s:bits.join(" · ")||null};
    }
    if(card.overall_odds) return {v:card.overall_odds, l:"overall odds", s:null};
  }
  if(mode==="most_prizes"){
    if(card.unclaimed_prizes_label){
      var v=card.unclaimed_prizes_label.replace(/\s*prizes unclaimed\s*$/i,"");
      return {v:v, l:"prizes unclaimed", s:card.overall_odds?card.overall_odds+" overall":null};
    }
    if(card.overall_odds) return {v:card.overall_odds, l:"overall odds", s:null};
  }
  return null;
}

  var stat = statFor(card, mode);
  var statHtml = stat
    ? '<div class="stat"><div class="stat-v">'+esc(stat.v)+'</div>\n<div class="stat-l">'+esc(stat.l)+'</div>\n'+(stat.s?'<div class="stat-s">'+esc(stat.s)+'</div>':'')+'</div>'
    : '<div class="stat"><div class="stat-v stat-none">n/a</div></div>';
  var img = card.image_url
    ? '<img src="'+esc(card.image_url)+'" alt="'+esc(card.title)+' ticket" loading="lazy" decoding="async" onerror="this.parentNode.classList.add(\'err\')">'
    : '';
  var price = showPrice
    ? '<span class="denom-bub" title="$'+esc(card.price)+' ticket">$'+esc(card.price)+'</span>'
    : '';
  return '<article class="row is-'+card.kind+'">'
    + '<div class="thumb'+(card.image_url?'':' err')+'">'+img+'</div>'
    + '<div class="row-head"><div class="row-title">'+esc(card.title)+'</div>'+price+'</div>'
    + '<p class="row-reason">'+esc(card.reason)+'</p>'
    + statHtml
    + '</article>';
}

/* banded card, chrome cloned from the draw game cards */
function sectionHTML(opts){
  var cards=opts.cards;
  var figHtml = opts.fig ? '<span class="scard-fig">'+esc(opts.fig)+'</span>' : '';
  var subHtml = opts.sub ? '<h3 class="scard-sub">'+esc(opts.sub)+'</h3>' : '';
  return '<section class="scard'+(opts.kind==="avoid"?" is-avoid":"")+'">'
    + '<div class="scard-band"><h2>'+esc(opts.band)+'</h2>'+figHtml+'</div>'
    + '<div class="scard-body">'
    + subHtml
    + '<div class="rows">'+cards.map(function(c){return rowHTML(c,opts.mode,opts.showPrice);}).join("")+'</div>'
    + '</div>'
    + '<div class="scard-fine">'+esc(opts.fine)+'</div>'
    + '</section>';
}

function countFig(n){ return n+(n===1?" game":" games"); }

/* ---------- scratchers view ---------- */
function renderScratchers(){
  var mode=state.mode, html="";
  var m=RAW.modes.find(function(x){return x.key===mode;});
  var fineBest="Mode: "+m.label+" · Ranked: "+m.tagline;
  var fineAvoid="Mode: "+m.label+" · California Lottery public data";
  if(state.denom==="overall"){
    var meta=OV_META[mode], cards=RAW.data[mode].best_overall;
    html += '<div class="view-head">'
         +  '<h1 class="view-title"><span class="hl">'+esc(meta.title)+'</span></h1>'
         +  '<p class="view-sub">Today’s top three across every price point, ranked for this lens. Pick a denomination on the left to go deeper.</p></div>';
    html += sectionHTML({band:"Top Three", fig:"",
                         sub:"", fine:fineBest,
                         cards:cards, mode:mode, kind:"best", showPrice:true});
  } else {
    var d=String(state.denom), node=RAW.data[mode].by_denom[d]||{best:[],avoid:[]};
    html += '<div class="view-head">'
         +  '<h1 class="view-title"><span class="hl">$'+d+' Scratchers</span></h1></div>';
    if(node.best && node.best.length)
      html += sectionHTML({band:BAND_BEST[mode], fig:countFig(node.best.length),
                           sub:"Today’s picks", fine:fineBest,
                           cards:node.best, mode:mode, kind:"best", showPrice:false});
    if(node.avoid && node.avoid.length)
      html += sectionHTML({band:"Skip These", fig:countFig(node.avoid.length),
                           sub:"Jackpot traps", fine:fineAvoid,
                           cards:node.avoid, mode:mode, kind:"avoid", showPrice:false});
  }
  els.content.innerHTML=html;
}

/* ---------- draw view (ported from peach.pit/lotto-draw-mockup) ---------- */
function ballRow(slip, specialName){
  var whites = slip.white_numbers.map(function(n){return '<span class="ball">'+n+'</span>';}).join("");
  var special = "";
  if(slip.special_number!=null){
    special = '<span class="plus">+</span><span class="ball special">'+slip.special_number+'</span>';
  }
  return '<div class="pick-row">'+whites+special+'</div>';
}

function gameCard(g){
  if(!g.ok) return "";
  var accent = ACCENTS[g.game_id]||"green";
  var matrix = g.special_ball_name
    ? "5 of "+g.white_pool+" + "+esc(g.special_ball_name)+" of "+g.special_pool
    : "5 of "+g.white_pool;
  var badge = g.best_tonight
    ? '<div class="best-badge" title="Logic’s Pick, best expected value of these games (a value ranking, not a prediction)">'
      + '<span class="b1">Logic’s<br>Pick</span><span class="b2">Best Value</span></div>'
    : "";
  function block(title, slips){
    return '<div class="pick-block"><h4>'+title+'</h4>'
      + slips.map(function(s){return ballRow(s, g.special_ball_name);}).join("")+'</div>';
  }
  var gmeta = '<div class="gmeta">'
    + '<span class="g-draw"><b>Next draw</b> '+esc(g.next_draw||"TBD")+'</span>'
    + '<span class="g-cost">$'+g.ticket_cost+' per play</span>'
    + '</div>';
  return '<article class="game'+(g.best_tonight?" is-best":"")+'" data-accent="'+accent+'" id="game-'+esc(g.game_id)+'">'
    + badge
    + '<div class="strip"><h2>'+esc(g.display_name)+'</h2><span class="jackpot">'+fmtJackpot(g.jackpot)+'</span></div>'
    + gmeta
    + '<div class="gbody">'+block("Hot picks", g.hot)+block("Due / cold picks", g.due)+'</div>'
    + '<div class="window">'+matrix+' · Read from the last '+g.history_window_draws+' draws</div>'
    + '</article>';
}

function renderDraw(){
  els.content.innerHTML =
    '<header class="draw-hdr"><div class="card">'
    + '<h1>Hot &amp; Cold Numbers</h1>'
    + '<span class="sub">Top picks for each game’s next draw</span>'
    + '</div></header>'
    + '<div class="games-grid">'+DRAW.games.map(gameCard).join("")+'</div>'
    + '<details class="info-toggle"><summary>Info</summary>'
    + '<section class="legend">'
    + '<div class="box"><h5>Hot picks</h5><p>'+esc(DRAW.strategies.hot)+'</p></div>'
    + '<div class="box"><h5>Due / cold picks</h5><p>'+esc(DRAW.strategies.due)+'</p></div>'
    + '</section>'
    + '<section class="fine"><div class="box">'
    + '<h5>Read this part</h5><p>'+esc(DRAW.meaning)+'</p>'
    + '<h5>★ The gold seal</h5><p>'+esc(DRAW.best_tonight_meaning)+'</p>'
    + '</div></section>'
    + '</details>';
}

function renderContent(){
  if(state.surface==="draw") renderDraw(); else renderScratchers();
}

/* ---------- chrome ---------- */
function renderChrome(){
  var onDraw = state.surface==="draw";
  document.body.classList.toggle("on-draw", onDraw);
  els.modebar.style.display = onDraw ? "none" : "";
  Array.prototype.forEach.call(els.surfaceToggle.querySelectorAll(".surface-btn"),function(b){
    var on=b.dataset.surface===state.surface;
    b.classList.toggle("active",on); b.setAttribute("aria-pressed",on);
  });
  if(!onDraw){
    var m=RAW.modes.find(function(x){return x.key===state.mode;});
    els.modeBlurb.textContent=m.blurb;
    Array.prototype.forEach.call(els.modeBtns.children,function(b){
      var on=b.dataset.mode===state.mode;
      b.classList.toggle("active",on); b.setAttribute("aria-pressed",on);
    });
  }
  var best=onDraw?[]:((RAW.topbar[state.mode]||{}).best_denoms||[]);
  Array.prototype.forEach.call(els.railNav.children,function(item){
    var key=onDraw?item.dataset.game:item.dataset.denom;
    var want=onDraw?String(state.game):String(state.denom);
    var on=key===want;
    item.classList.toggle("active",on);
    if(on) item.setAttribute("aria-current","page"); else item.removeAttribute("aria-current");
    var dot=item.querySelector(".nav-dot");
    if(dot) dot.classList.toggle("off", onDraw || best.indexOf(Number(item.dataset.denom))<0);
  });
}

function renderAll(){ renderChrome(); renderContent(); }

/* ---------- nav (rebuilt per surface; permanently collapsed strip) ---------- */
function buildNav(){
  var html="";
  if(state.surface==="scratchers"){
    html += '<button class="nav-item" data-denom="overall" title="Overall">All</button>';
    RAW.denominations.forEach(function(d){
      html += '<button class="nav-item" data-denom="'+d+'" title="$'+d+' Scratchers">$'+d
        + '<span class="nav-dot off" aria-hidden="true"></span></button>';
    });
  } else {
    DRAW.games.forEach(function(g){
      if(!g.ok) return;
      html += '<button class="nav-item" data-game="'+esc(g.game_id)+'" title="'+esc(g.display_name)+'">'
        + esc(GAME_ABBR[g.game_id]||g.display_name.slice(0,2).toUpperCase())
        + (g.best_tonight?'<span class="nav-dot" aria-hidden="true"></span>':'')
        + '</button>';
    });
  }
  els.railNav.innerHTML=html;
}

els.railNav.addEventListener("click",function(e){
  var item=e.target.closest(".nav-item"); if(!item) return;
  if(state.surface==="scratchers"){
    state.denom=item.dataset.denom;
    renderAll();
    window.scrollTo({top:0});
  } else {
    state.game=item.dataset.game;
    renderChrome();
    var card=document.getElementById("game-"+state.game);
    if(card) card.scrollIntoView({block:"start"});
  }
});

function buildModes(){
  var ordered = MODE_ORDER.map(function(k){ return RAW.modes.find(function(m){return m.key===k;}); }).filter(Boolean)
    .concat(RAW.modes.filter(function(m){ return MODE_ORDER.indexOf(m.key)===-1; }));
  els.modeBtns.innerHTML=ordered.map(function(m){
    return '<button class="mode-btn" data-mode="'+m.key+'">'+esc(m.label)+'</button>';
  }).join("");
  els.modeBtns.addEventListener("click",function(e){
    var b=e.target.closest(".mode-btn"); if(!b) return;
    state.mode=b.dataset.mode;
    renderAll();
  });
}

function buildTipFoot(){
  var t=RAW.tip_block;
  els.tip.innerHTML='<span class="tip-line">'+esc(t.line)+'</span>'
    + '<a class="tip-btn" href="'+esc(t.button_href)+'" target="_blank" rel="noopener">'+esc(t.button_label)+'</a>'
    + '<span class="tip-note">'+esc(t.note)+'</span>';
  els.foot.innerHTML='<div>'+esc(RAW.footer_text)+'</div><div class="num-fig">'+esc(RAW.disclaimer)+'</div>'
    + '<div class="scratch-stripe" aria-hidden="true"></div>'
    + '<div class="rg-line">Play responsibly · <a href="tel:18004262537">1-800-GAMBLER</a> (or text SUPPORT to 53342) · <a href="https://www.calottery.com/play-responsibly" target="_blank" rel="noopener">calottery.com/play-responsibly</a></div>';
  els.dateline.textContent=RAW.generated_at;
}

/* ---------- surface toggle ---------- */
els.surfaceToggle.addEventListener("click",function(e){
  var b=e.target.closest(".surface-btn"); if(!b) return;
  if(b.dataset.surface===state.surface) return;
  state.surface=b.dataset.surface;
  buildNav();
  renderAll();
  window.scrollTo({top:0});
});

/* ---------- boot ---------- */
/* degrade-quietly: no usable draw data this build → hide the Draw surface */
if(!DRAW.games.some(function(g){return g.ok;})){
  var drawBtn=els.surfaceToggle.querySelector('[data-surface="draw"]');
  if(drawBtn) drawBtn.style.display="none";
}
buildNav(); buildModes(); buildTipFoot();
renderAll();
})();
</script>
<script>
// visit beacon — every hit, skip bots, fail silent
try {
  const ua = navigator.userAgent.toLowerCase();
  if (!/bot|crawler|spider|preview|facebookexternal|slackbot|twitterbot|linkedinbot|whatsapp|discordbot/.test(ua)) {
    fetch('/beacon', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        page: 'lotto',
        ref: document.referrer || 'direct',
        tag: 'money_bag'
      })
    }).catch(() => {});
  }
} catch (e) {}
</script>
</body>
</html>
