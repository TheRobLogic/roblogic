<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BC Lotto — BC Lottery &amp; Scratch Picks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23B31B34'/%3E%3Ctext x='50' y='69' font-size='58' font-family='Arial,Helvetica,sans-serif' font-weight='800' text-anchor='middle' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@800&family=Michroma&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS — BC Lotto / PlayNow brand (ticket #1179 v3) =================
   v3 = CA-parity rework: CA's page structure/copy/features ported 1:1 (mode switcher,
   best_overall Top Three, per-denom best/avoid, draw best_tonight badge, INFO+ panels),
   reskinned to BC's OWN brand (this token block, carried over unchanged from v2 — Rob
   8/5: "use the bc lotto color schemes and fonts, not that crap we use for the california").
   Fonts: Fort/Proxima Nova are PlayNow's real (non-licensable) faces; Inter/Montserrat
   stand in for them (body/UI + display roles respectively).
   Colors verified against PlayNow's own CSS, fetched live 2026-08-05/06:
     - crimson #B31B34 (+hover/dark #940117, +light #D03D53) = primary brand/CTAs
     - per-game panel colors = winning-numbers/jackpot__body_* rules, verbatim
     - orange = "best" card band, crimson = "avoid" card band (no new hues added)
*/
:root{
  color-scheme:light;
  /* brand */
  --crimson:#B31B34;--crimson-dark:#940117;--crimson-light:#D03D53;
  --gold:#F1C40F;--gold-deep:#F9B201;--gold-deep-rgb:249,178,1;
  --orange:#F15B25;--orange-deep:#E86A10;
  /* per-game panel colors — keyed by id="game-<game_id>" (bc_draw_picks.py gameCard),
     not by a rotation, since the game order lives in bc_draw_picks.py GAME_META. */
  --g-lmax:#84BD00;
  --g-649:#F1C40F;
  --g-bc49-1:#F14344;--g-bc49-2:#7D0F0A;
  --g-dgrd-1:#F9B201;--g-dgrd-2:#E86A10;
  /* neutrals */
  --bg-page:#F2F2F2;--surface:#FFFFFF;--charcoal:#20252B;
  --border:#E6E6E6;--border-strong:#D9D9D9;
  --ink:#1A1A1A;--body-text:#4A4A4A;--muted:#6B6B6B;--faint:#8A8A8A;
  /* fonts */
  --font-display:"Montserrat",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  /* geometry */
  --radius-card:12px;--radius-sm:8px;--radius-pill:999px;
  --shadow-card:0 2px 8px rgba(0,0,0,.10);
  --fs-view:32px;--fs-title:17px;
  --rail-w:84px;--tb-h:130px;
  --thumb-w:132px;--thumb-h:92px;
}

/* ================= BONES ================= */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scrollbar-gutter:stable}
body{
  background:var(--bg-page);color:var(--body-text);
  font-family:var(--font-body);font-weight:400;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:var(--crimson);text-decoration:none}
a:hover{color:var(--crimson-dark);text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.num-fig{font-family:var(--font-body);font-variant-numeric:tabular-nums}

.app{display:flex;min-height:100vh}

/* ---------------- masthead ---------------- */
.topbar{
  position:sticky;top:0;z-index:50;background:var(--charcoal);
  border-bottom:3px solid var(--crimson);
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.topbar-inner{
  max-width:1180px;margin:0 auto;padding:16px 40px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
.brand-word{
  margin:0;font-family:var(--font-display);font-weight:800;
  font-size:26px;letter-spacing:.02em;line-height:1.1;text-align:center;
  color:#fff;text-transform:uppercase;
}
.brand-word .hl{color:var(--crimson-light)}
.brand-tagline{
  margin:5px 0 0;text-align:center;font-family:var(--font-body);font-weight:600;
  font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);
}
.dateline{
  margin-top:2px;text-align:center;
  font-family:var(--font-body);font-weight:600;font-size:11.5px;color:rgba(255,255,255,.68);
  letter-spacing:.14em;text-transform:uppercase;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.surface-toggle{
  display:flex;align-items:stretch;gap:4px;flex:0 0 auto;flex-wrap:wrap;justify-content:center;
  background:rgba(255,255,255,.08);border-radius:var(--radius-pill);padding:4px;
}
.surface-btn{
  padding:9px 22px;font-family:var(--font-body);font-size:14px;font-weight:600;
  letter-spacing:.03em;color:rgba(255,255,255,.72);border-radius:var(--radius-pill);
  transition:background 120ms ease,color 120ms ease;
}
.surface-btn:hover{color:#fff}
.surface-btn.active{background:var(--crimson);color:#fff}
.coffee-top{
  display:inline-flex;align-items:center;padding:9px 20px;font-family:var(--font-body);
  font-size:14px;font-weight:600;letter-spacing:.03em;color:var(--ink);
  background:var(--gold-deep);border-radius:var(--radius-pill);white-space:nowrap;
}
.coffee-top:hover{text-decoration:none;background:#ffc233}
.coffee-top .coffee-short{display:none}

/* ---------------- left rail ---------------- */
.rail{
  width:var(--rail-w);flex:0 0 auto;
  position:sticky;top:var(--tb-h);height:calc(100vh - var(--tb-h));overflow-y:auto;
  background:transparent;border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:40;
}
.rail-nav{padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.nav-item{
  position:relative;display:flex;align-items:center;justify-content:center;
  height:38px;padding:0 10px;white-space:nowrap;border-radius:var(--radius-pill);
  color:var(--muted);background:transparent;
  font-family:var(--font-body);font-weight:600;font-size:13px;
  letter-spacing:.01em;font-variant-numeric:tabular-nums;
  transition:color 120ms ease,background 120ms ease;
}
.nav-item:hover{color:var(--ink);background:var(--surface)}
.nav-item.active{color:#fff;background:var(--crimson)}
.nav-dot{
  position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;
  background:var(--orange);opacity:0;transition:opacity 120ms ease;
}
.nav-dot.on{opacity:1}
.nav-item.active .nav-dot.on{background:#fff}

/* ---------------- main pane ---------------- */
.main{flex:1 1 auto;min-width:0;background:transparent}
body.on-draw .rail{display:none}
.shell{max-width:1180px;margin:0 auto;padding:0 40px 80px}

/* ---------------- mode switcher ---------------- */
.modebar{margin:28px 0 0}
.mode-trigger{display:none} /* desktop/tablet: no trigger; mode panel always shown (≤720px: tap-to-open, #1181) */
.mode-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mode-btn{
  font-family:var(--font-body);font-weight:700;font-size:13.5px;letter-spacing:.02em;
  text-align:center;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:var(--radius-sm);
  padding:13px 10px;box-shadow:var(--shadow-card);
  transition:background 120ms ease,color 120ms ease,border-color 120ms ease;
}
.mode-btn:hover{border-color:var(--crimson)}
.mode-btn.active{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.mode-blurb{
  margin:12px 0 0;font-family:var(--font-body);font-style:italic;font-size:14.5px;
  color:var(--body-text);background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);box-shadow:var(--shadow-card);padding:13px 18px;text-align:center;
}

/* ---------------- headers ---------------- */
.view-head{margin:32px 0 0}
.view-title{
  margin:0;font-family:var(--font-display);font-size:var(--fs-view);
  font-weight:800;letter-spacing:-.01em;line-height:1.15;color:var(--ink);
}
.view-title .hl{
  background-image:linear-gradient(180deg,transparent 58%,rgba(var(--gold-deep-rgb),.4) 58%);
  padding:0 .06em;margin:0 -.06em;box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.view-sub{margin:10px 0 0;font-size:15px;color:var(--body-text);max-width:64ch}
noscript p{margin:40px 0}

/* ---------------- scratcher price-band cards ---------------- */
.scard{margin-top:24px;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);box-shadow:var(--shadow-card);overflow:hidden}
.scard-band{
  background:linear-gradient(135deg,var(--orange),var(--orange-deep));color:#fff;
  padding:14px 22px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
}
.scard.is-avoid .scard-band{background:linear-gradient(135deg,var(--crimson),var(--crimson-dark))}
.scard-band h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.1;color:#fff}
.scard-fig{margin-left:auto;font-family:var(--font-body);font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;color:rgba(255,255,255,.9)}
.scard-body{padding:6px 22px 2px}
.scard-sub{
  margin:14px 0 6px;font-family:var(--font-body);font-weight:700;font-size:11.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:center;gap:10px;line-height:1.5;
}
.scard-sub::after{content:"";flex:1;border-top:1px dashed var(--border-strong)}
.scard-fine{
  font-family:var(--font-body);font-weight:400;font-size:11.5px;letter-spacing:.02em;
  color:var(--faint);border-top:1px solid var(--border);
  padding:12px 22px;background:var(--bg-page);line-height:1.5;text-transform:uppercase;
}

.rows{display:flex;flex-direction:column}
.row{
  display:grid;
  grid-template-columns:var(--thumb-w) minmax(150px,220px) minmax(0,1fr) minmax(120px,max-content);
  grid-template-areas:"thumb head reason stat";
  gap:5px 20px;align-items:center;
  padding:18px 0;border-bottom:1px solid var(--border);
}
.rows .row:last-child{border-bottom:0}
.row:hover{background:var(--bg-page)}
.thumb{
  grid-area:thumb;width:var(--thumb-w);height:var(--thumb-h);
  background:var(--bg-page);border:1px solid var(--border);border-radius:var(--radius-sm);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb.err{font-family:var(--font-body);font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.thumb.err img{display:none}
.thumb.err::after{content:"no art"}
.thumb-noart{display:none} /* mobile-only upgrade of the "no art" fallback, #1181 — see ≤720 block */
.row-head{grid-area:head;min-width:0;display:flex;align-items:center;gap:10px}
.row-title{font-family:var(--font-body);font-weight:700;font-size:var(--fs-title);line-height:1.28;letter-spacing:-.003em;color:var(--ink);min-width:0}
.denom-bub{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  font-family:var(--font-body);font-weight:700;font-size:11.5px;color:var(--ink);
  font-variant-numeric:tabular-nums;
  background:#fff;border:1.5px solid var(--border-strong);
}
.row-reason{grid-area:reason;font-size:14px;line-height:1.5;color:var(--body-text);max-width:52ch}
.row.is-avoid .row-title{color:var(--muted)}
.row.is-avoid .thumb{opacity:.75}
.stat{grid-area:stat;text-align:right;justify-self:end}
.stat-v{font-family:var(--font-display);font-size:23px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.stat-v.stat-none{color:var(--faint);font-weight:600;font-size:15px}
.stat-l{margin-top:3px;font-family:var(--font-body);font-weight:600;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.stat-s{margin-top:3px;font-family:var(--font-body);font-weight:400;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
/* #1190 Pass 2: top-prize line (s2) + the pre-existing depletion count,
   reprioritized as a SECONDARY line (s3, deliberately more muted/smaller
   than s/s2) + the non-full math-class badge -- "visually distinct but not
   shouty": a calm neutral outline pill, never the avoid/crimson treatment. */
.stat-s2{margin-top:2px;font-family:var(--font-body);font-weight:400;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat-s3{margin-top:6px;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.stat-badge{
  display:inline-block;margin-top:4px;padding:3px 9px;border-radius:var(--radius-pill);
  background:var(--bg-page);border:1px solid var(--border-strong);
  font-family:var(--font-body);font-weight:700;font-size:9.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;cursor:help;
}

/* ---------------- draw surface ---------------- */
.games-grid{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.game{position:relative;border:1px solid var(--border);border-radius:var(--radius-card);background:var(--surface);box-shadow:var(--shadow-card);overflow:hidden;scroll-margin-top:calc(var(--tb-h) + 16px)}
.game.is-best{box-shadow:var(--shadow-card),0 0 0 3px var(--gold-deep)}
.game .strip{padding:18px 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;background:var(--charcoal);color:#fff}
.game .strip h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:21px;line-height:1.1}
.game .strip .jackpot{margin-left:auto;font-family:var(--font-display);font-weight:800;font-size:20px;white-space:nowrap}
.game .strip .jackpot.jackpot-small{font-size:14.5px;letter-spacing:.01em}
.game.is-best .strip{padding-right:82px}
.game.is-best .gmeta{padding-right:82px}
.best-badge{
  position:absolute;top:10px;right:10px;z-index:2;
  width:60px;height:60px;border-radius:50%;
  background:var(--gold-deep);border:2px solid var(--charcoal);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;font-family:var(--font-body);font-weight:700;text-transform:uppercase;
  transform:rotate(6deg);box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.best-badge .b1{font-size:9px;letter-spacing:.03em;line-height:1.1;color:var(--ink)}
.best-badge .b2{font-size:6.5px;letter-spacing:.1em;margin-top:2px;color:var(--ink)}
.game .gmeta{
  display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;
  padding:11px 20px;background:var(--bg-page);border-bottom:1px solid var(--border);
  font-family:var(--font-body);font-weight:400;font-size:12px;letter-spacing:.02em;color:var(--muted);
}
.game .gmeta b{color:var(--ink);font-weight:700}
.game .gmeta .g-cost{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.game .gmeta .g-extra{color:var(--crimson-dark);font-weight:600;white-space:nowrap}
.game .gbody{padding:18px 20px 20px;display:grid;gap:18px}
.pick-block h4{
  margin:0 0 10px;font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;line-height:1.5;display:flex;align-items:center;gap:10px;color:var(--muted);
}
.pick-block h4::after{content:"";flex:1;border-top:1px solid var(--border)}
.pick-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ball{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;background:#fff;color:var(--ink);
  border:1.5px solid var(--border-strong);border-radius:50%;
  font-family:var(--font-body);font-weight:600;font-size:14.5px;
  font-variant-numeric:tabular-nums;
}
.plus{font-family:var(--font-body);font-weight:700;font-size:15px;color:var(--faint);padding:0 2px}
.ball.special{background:var(--gold);color:var(--ink);border-color:var(--gold)}

/* per-game jackpot-strip colors — id-keyed, not position-keyed */
#game-lotto-max   .strip{background:var(--g-lmax);color:var(--ink)}
#game-lotto-649   .strip{background:var(--g-649);color:var(--ink)}
#game-bc-49       .strip{background:linear-gradient(180deg,var(--g-bc49-1),var(--g-bc49-2));color:#fff}
#game-daily-grand .strip{background:linear-gradient(180deg,var(--g-dgrd-1),var(--g-dgrd-2));color:var(--ink)}

.game .window{
  font-family:var(--font-body);font-weight:400;font-size:11px;letter-spacing:.02em;
  color:var(--faint);border-top:1px solid var(--border);padding:11px 20px;background:var(--bg-page);line-height:1.5;
}

/* ---- Take a Moonshot! doorway band (Draw surface -> ./moonshot/, #1181 —
   ported verbatim from the CA page's own band, SCRATCH/ca-lotto-source.html:
   dark-space colors are the destination page's OWN palette, not BC's crimson
   brand, since the band previews what moonshot/ actually looks like) ---- */
.moonshot-band{position:relative;display:block;overflow:hidden;margin:24px 0 0;padding:18px 118px 18px 20px;
 background:#0B0E1A;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);text-decoration:none;
 background-image:
  radial-gradient(ellipse 70% 120% at 96% 50%,rgba(84,104,196,.28),transparent 65%),
  radial-gradient(1.4px 1.4px at 8% 30%,#E8ECFF 50%,transparent 51%),
  radial-gradient(1px 1px at 22% 68%,rgba(232,236,255,.8) 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 38% 24%,rgba(232,236,255,.9) 50%,transparent 51%),
  radial-gradient(1px 1px at 52% 74%,rgba(232,236,255,.7) 50%,transparent 51%),
  radial-gradient(1.3px 1.3px at 64% 34%,#E8ECFF 50%,transparent 51%),
  radial-gradient(1px 1px at 76% 62%,rgba(232,236,255,.75) 50%,transparent 51%)}
.moonshot-band:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.moonshot-band .ms-moon{position:absolute;right:-12px;bottom:-20px;width:118px;height:auto;transform:rotate(-7deg);
 filter:drop-shadow(0 0 16px rgba(240,237,223,.4))}
.moonshot-band .ms-title{display:block;font-family:"Michroma",sans-serif;font-size:17px;letter-spacing:.1em;
 text-transform:uppercase;color:#F0EDDF;text-shadow:0 0 16px rgba(132,152,255,.55)}
.moonshot-band .ms-sub{display:block;margin-top:5px;font-family:"Oswald",sans-serif;font-weight:400;font-size:12px;
 letter-spacing:.14em;text-transform:uppercase;color:#8C94B8}
.moonshot-band .ms-arrow{position:absolute;right:132px;top:50%;transform:translateY(-50%);
 font-family:"Oswald",sans-serif;font-weight:700;font-size:22px;color:#F2B33D}
@media(max-width:640px){
 .moonshot-band{padding:14px 104px 14px 16px}
 .moonshot-band .ms-moon{width:86px;right:-8px;bottom:-14px}
 .moonshot-band .ms-title{font-size:14.5px}
 .moonshot-band .ms-sub{font-size:10.5px;letter-spacing:.12em}
 .moonshot-band .ms-arrow{display:none}
}

/* ---------------- legend / info drawer ---------------- */
.legend{margin-top:24px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.legend .box{border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);box-shadow:var(--shadow-card);padding:16px 18px}
.legend h5{margin:0 0 8px;font-family:var(--font-body);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--crimson);line-height:1.4}
.legend p{margin:0;font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--body-text)}
.fine{margin-top:20px}
.fine .box{border-radius:var(--radius-card);background:var(--charcoal);color:#fff;padding:20px 22px}
.fine h5{margin:0 0 10px;font-family:var(--font-body);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-deep);line-height:1.4}
.fine h5+p{margin-bottom:16px}
.fine p{margin:0 0 12px;font-family:var(--font-body);font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.82)}
.fine p:last-child{margin-bottom:0}
.info-toggle{margin-top:24px}
.info-toggle>summary{
  list-style:none;cursor:pointer;width:fit-content;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--font-body);font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-pill);box-shadow:var(--shadow-card);
  padding:10px 20px;line-height:1.2;
}
.info-toggle>summary::-webkit-details-marker{display:none}

.info-toggle[open]>summary::after{content:"\2013"}
.info-toggle>summary:hover{border-color:var(--crimson)}

/* ---------------- tip + footer ---------------- */
.tip{
  margin-top:44px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-card);
  padding:26px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
}
.tip-line{font-family:var(--font-display);font-weight:800;font-size:20px;color:var(--ink)}
.tip-btn{
  display:inline-block;font-family:var(--font-body);font-weight:700;letter-spacing:.02em;font-size:15px;
  color:#fff;background:var(--crimson);border-radius:var(--radius-pill);padding:13px 28px;
  white-space:nowrap;transition:background 120ms ease,transform 80ms ease;
}
.tip-btn:hover{background:var(--crimson-dark);transform:translateY(-1px);text-decoration:none;color:#fff}
.tip-btn:active{transform:translateY(0)}
.tip-note{font-family:var(--font-body);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
footer{
  margin-top:36px;padding:22px 24px;background:var(--charcoal);border-radius:var(--radius-card);
  text-align:center;font-family:var(--font-body);font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;font-size:12px;color:rgba(255,255,255,.66);line-height:2;
}
footer .num-fig{font-family:var(--font-body);font-size:11px;letter-spacing:.06em;color:var(--gold-deep)}
.scratch-stripe{
  height:4px;margin-top:16px;border-radius:2px;
  background:linear-gradient(90deg,var(--crimson),var(--gold-deep),var(--crimson));
}
.rg-line{
  margin-top:14px;text-align:center;font-family:var(--font-body);font-size:11px;letter-spacing:.01em;
  color:rgba(255,255,255,.55);line-height:1.7;text-transform:none;
}
.rg-line a{color:rgba(255,255,255,.75);text-decoration:underline;text-underline-offset:2px}
.rg-line a:hover{color:#fff}

/* ============ MOBILE TILE GRID + DETAIL SHEET (phones, ≤600px, ported from CA #1181) ============ */
/* base guards (all widths): implied-denom bubbles + sheet exist in DOM but
   render only on phones — desktop/tablet layout untouched */
.denom-implied{display:none}
.sheet,.sheet-backdrop{display:none}
.controls-tab{display:none}

@media (max-width:600px){
  /* ---- pick rows become compact art tiles: image + price bubble + clamped name ---- */
  .rows{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 10px;padding:4px 0 14px}
  .view-head{display:none} /* redundant with the SORT BY tab on phones */
  .row{
    position:relative;display:flex;flex-direction:column;align-items:stretch;gap:7px;
    padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .row:hover{background:none}
  .row:active .thumb{transform:scale(.98)}
  .thumb{
    order:0;width:100%;max-width:none;height:auto;aspect-ratio:132/92;
    position:relative;box-shadow:var(--shadow-card);
  }
  .thumb img{width:100%;height:100%;object-fit:contain}
  .row-head{order:1;display:block;min-width:0}
  .row-title{
    font-size:12.5px;line-height:1.24;text-align:center;min-height:32px;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  }
  .rows .row .denom-bub{
    display:inline-flex;position:absolute;top:6px;right:6px;z-index:2;
    width:28px;height:28px;font-size:10.5px;
    background:var(--gold-deep);border-color:var(--gold-deep);box-shadow:var(--shadow-card);
  }
  .row .stat,.row .row-reason{display:none}

  /* top pick = full-width hero tile with the Logic's Pick flag */
  .rows .row.is-best:first-child{grid-column:1/-1}
  .rows .row.is-best:first-child .row-title{font-size:15px}
  .rows .row.is-best:first-child .thumb{box-shadow:0 4px 16px rgba(0,0,0,.14)}
  /* Today's Top Three (is-overall card): all three tiles at hero size */
  .scard.is-overall .rows .row{grid-column:1/-1}
  .scard.is-overall .row-title{font-size:15px}
  .scard.is-overall .thumb{box-shadow:0 4px 16px rgba(0,0,0,.14)}

  .rows .row.is-best:first-child .thumb::before,
  .row.is-avoid .thumb::before{
    position:absolute;top:6px;left:6px;z-index:2;line-height:1;
    font-family:var(--font-body);font-weight:700;font-size:10px;
    letter-spacing:.05em;text-transform:uppercase;padding:5px 9px 4px;
    border-radius:var(--radius-pill);box-shadow:var(--shadow-card);
  }
  .rows .row.is-best:first-child .thumb::before{content:"★ Logic’s Pick";background:var(--gold-deep);color:var(--ink)}
  .row.is-avoid .thumb::before{content:"✕ Skip";background:var(--crimson);color:#fff}
  .row.is-avoid .thumb img{filter:saturate(.5) contrast(.92)}

  /* ---- denom rail + mode panel tucked behind the SORT BY tab ---- */
  .controls-tab{
    display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    padding:10px 16px;border-top:1px solid var(--border);background:var(--surface);
    font-family:var(--font-body);font-weight:600;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink);
  }
  .controls-tab .ct-eyebrow{
    display:inline-flex;align-items:center;height:22px;padding:0 10px;
    background:var(--gold-deep);color:var(--ink);border-radius:var(--radius-pill);
    font-weight:700;font-size:10px;letter-spacing:.08em;
    transition:background .12s ease,color .12s ease;
  }
  body.controls-open .controls-tab .ct-eyebrow{background:var(--crimson);color:#fff}
  body:not(.controls-open) .rail{display:none}
  body:not(.controls-open) .modebar{display:none}
  body.on-draw .controls-tab{display:none}

  /* ---- tap-to-reveal bottom sheet (full pick detail) ---- */
  .sheet-backdrop{
    display:block;position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.5);
    opacity:0;pointer-events:none;transition:opacity .18s ease;
  }
  .sheet-backdrop.open{opacity:1;pointer-events:auto}
  .sheet{
    display:block;position:fixed;left:0;right:0;bottom:0;z-index:90;overflow:hidden;
    background:var(--surface);border-top-left-radius:var(--radius-card);border-top-right-radius:var(--radius-card);
    box-shadow:0 -8px 28px rgba(0,0,0,.22);
    max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translateY(103%);visibility:hidden;
    transition:transform .24s ease,visibility 0s linear .24s;
    padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  }
  .sheet.open{transform:none;visibility:visible;transition:transform .24s ease}
  body.sheet-open{overflow:hidden}
  .sheet-art{
    position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
    background:var(--bg-page);border-bottom:1px solid var(--border);aspect-ratio:132/92;
  }
  .sheet-art img{display:block;width:100%;height:100%;object-fit:contain}
  .sheet-noart{display:none}

  .sheet-art.err img{display:none}
  .sheet-x{

  .sheet-body{padding:16px 18px 22px}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .sheet-head .denom-bub{display:inline-flex;flex:0 0 auto}

  .sheet-chip{

  .sheet-stat{margin-top:12px;padding:12px 14px;background:var(--bg-page);border:1px solid var(--border);border-radius:var(--radius-sm)}
  .sheet-stat-v{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}

  .sheet-stat-l{margin-left:8px;font-family:var(--font-body);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .sheet-stat-s{margin-top:4px;font-family:var(--font-body);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .sheet-stat-s.sheet-stat-muted{color:var(--faint);font-size:12px}
  .sheet-reason{margin:14px 0 0;font-size:15px;line-height:1.55;color:var(--body-text)}
}

<script>
(function(){
"use strict";
var RAW  = JSON.parse(document.getElementById("lotto-data").textContent);
var DRAW = JSON.parse(document.getElementById("draw-data").textContent);

var GAME_ABBR = {"lotto-max":"LM","lotto-649":"6/49","bc-49":"BC49","daily-grand":"DG"};

var state = {
  surface:"scratchers",
  mode:(RAW.modes.find(function(m){return m.default;})||RAW.modes[0]).key,
  denom:"overall",
  game:(DRAW.games[0]||{}).game_id||null
};

/* mobile tiles: index -> card registry, rebuilt on every scratcher render (#1181) */
var tileCards = [];

/* frozen-row topbar: keep --tb-h in sync so the rail starts exactly under it */
(function(){
  var tb=document.querySelector(".topbar");
  function setTbH(){document.documentElement.style.setProperty("--tb-h",tb.getBoundingClientRect().height+"px")}
  if(window.ResizeObserver){new ResizeObserver(setTbH).observe(tb)}
  window.addEventListener("resize",setTbH);
  setTbH();
})();

var els = {
  railNav:document.getElementById("railNav"),
  dateline:document.getElementById("dateline"),
  surfaceToggle:document.getElementById("surfaceToggle"),
  modebar:document.getElementById("modebar"),
  modeTrigger:document.getElementById("modeTrigger"),
  modeTriggerCurrent:document.getElementById("modeTriggerCurrent"),
  modeBtns:document.getElementById("modeBtns"),
  modeBlurb:document.getElementById("modeBlurb"),
  content:document.getElementById("content"),
  tip:document.getElementById("tip"),
  foot:document.getElementById("foot"),
  sheet:document.getElementById("sheet"),
  sheetBackdrop:document.getElementById("sheetBackdrop"),
  controlsTab:document.getElementById("controlsTab"),
  controlsTabLabel:document.getElementById("controlsTabLabel")
};

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function fmtJackpot(j){
  if(j==null) return "";
  if(j>=1e6){
    var m=j/1e6;
    var num=Number.isInteger(m)?m.toLocaleString("en-US"):m.toFixed(1);
    return "$"+num+" Million";
  }
  return "$"+j.toLocaleString("en-US",{maximumFractionDigits:0});
}
function fmtAnnuity(a){
  if(!a) return "";
  return "$"+Math.round(a.amount).toLocaleString("en-US")+" a "+a.frequency+" for "+a.duration;
}

/* ---------- scratcher stat block (#1190 Pass 2) ---------- */
/* Card math has 3 shapes (bclotto_page.py's _card_math_shape, NEVER
   re-derived here -- this function only reads the fields it already sends):
     "full"      -> printed odds headline + printed RTP + top-prize line +
                    the existing depletion count as a SECONDARY line.
     "odds_only" -> printed odds headline ONLY (no RTP line), a small class
                    badge (Partial table / Short table / Odds only) instead.
     "no_data"   -> no tier-cache row yet -- pre-#1190 fallback shape
                    (unclaimed-count headline), never hidden. */
function statFor(card){
  if(card.printed_odds_text && (card.math_shape==="full" || card.math_shape==="odds_only")){
    return {
      v: card.printed_odds_text,
      l: "tickets win something",
      s: card.math_shape==="full" ? (card.printed_rtp_text||null) : null,
      s2: card.math_shape==="full" ? (card.top_prize_text||null) : null,
      s3: card.unclaimed_prizes_label || null,
      badge: card.math_shape==="odds_only" ? (card.math_class_label||"Odds only") : null,
      badgeTitle: card.math_class_reason||""
    };
  }
  if(!card.unclaimed_prizes_label) return null;
  /* #1199 label shape: "971 prizes of $50+ still out there" or "971 prizes
     still out there" (floor only when the game's own feed floor is known) */
  var m = card.unclaimed_prizes_label.match(/^([\d.,]+[KM]?)\s+prizes(?:\s+of\s+(\$[\d,]+\+))?/);
  if(!m) return {v:card.unclaimed_prizes_label, l:"", s:null, s2:null, s3:null, badge:null, badgeTitle:""};
  return {v:m[1], l:(m[2] ? m[2]+" " : "")+"prizes still out there", s:null, s2:null, s3:null, badge:null, badgeTitle:""};
}

function rowHTML(card, showPrice){
  var stat = statFor(card);
  var statHtml = stat
    ? '<div class="stat-v">'+esc(stat.v)+'</div><div class="stat-l">'+esc(stat.l)+'</div>'
      +(stat.badge?'<div class="stat-badge" title="'+esc(stat.badgeTitle)+'">'+esc(stat.badge)+'</div>':'')
      +(stat.s?'<div class="stat-s">'+esc(stat.s)+'</div>':'')
      +(stat.s2?'<div class="stat-s2">'+esc(stat.s2)+'</div>':'')
      +(stat.s3?'<div class="stat-s3">'+esc(stat.s3)+'</div>':'')
    : '<div class="stat-v stat-none">n/a</div>';
  var img = card.image_url
    ? '<img src="'+esc(card.image_url)+'" alt="'+esc(card.title)+' ticket" loading="lazy" decoding="async" onerror="this.parentNode.classList.add(\'err\')">'
    : '';
  var noArt = '<span class="thumb-noart">'+esc(card.title)+'</span>';
  /* denom bubble now always in markup — phone tiles need it even when the
     section implies the price; .denom-implied keeps it hidden ≥601px (desktop parity, #1181) */
  var price = '<span class="denom-bub'+(showPrice?'':' denom-implied')+'" title="$'+esc(card.price)+' ticket">$'+esc(card.price)+'</span>';
  var ti = tileCards.push(card)-1;
  return '<article class="row is-'+card.kind+'" data-ti="'+ti+'">'
    + '<div class="thumb'+(card.image_url?'':' err')+'">'+img+noArt+'</div>'
    + '<div class="row-head">'+price+'<span class="row-title">'+esc(card.title)+'</span></div>'
    + '<p class="row-reason">'+esc(card.reason)+'</p>'
    + '<div class="stat">'+statHtml+'</div>'
    + '</article>';
}

function countFig(n){ return n+(n===1?" game":" games"); }

function sectionHTML(opts){
  var figHtml = opts.fig ? '<span class="scard-fig">'+esc(opts.fig)+'</span>' : '';
  var subHtml = opts.sub ? '<h3 class="scard-sub">'+esc(opts.sub)+'</h3>' : '';
  return '<section class="scard'+(opts.kind==="avoid"?" is-avoid":"")+(opts.wide?" is-overall":"")+'">'
    + '<div class="scard-band"><h2>'+esc(opts.band)+'</h2>'+figHtml+'</div>'
    + '<div class="scard-body">'+subHtml
    + '<div class="rows">'+opts.cards.map(function(c){return rowHTML(c,opts.showPrice);}).join("")+'</div>'
    + '</div>'
    + '<div class="scard-fine">'+esc(opts.fine)+'</div>'
    + '</section>';
}

/* ---------- scratchers view ---------- */
/* #1190 Pass 2: most_prizes/balanced repurposed to printed-odds/RTP ranking
   (bclotto_page.py's MODES/OV_TITLE/BAND_BEST -- keep these two IN SYNC by
   hand, this is the copy that actually renders). Keys unchanged. */
var OV_TITLE = {most_prizes:"Best Odds Today",balanced:"Best Payback Today",
                low_vol:"Best Bets to Win Something",high_vol:"Biggest Swings Today"};
var BAND_BEST = {most_prizes:"Best Odds",balanced:"Best Payback",
                 low_vol:"Best Bets to Win Something",high_vol:"Biggest Swings"};

function renderScratchers(){
  tileCards=[];
  var mode=state.mode, html="";
  var m=RAW.modes.find(function(x){return x.key===mode;});
  var fineBest="Mode: "+m.label+" · Ranked: "+m.tagline;
  var fineAvoid="Mode: "+m.label+" · "+RAW.disclaimer;
  if(state.denom==="overall"){
    var cards=RAW.data[mode].best_overall;
    html += '<div class="view-head"><h1 class="view-title"><span class="hl">'+esc(OV_TITLE[mode])+'</span></h1></div>';
    html += sectionHTML({band:"Today's Top Three", fig:"", sub:"", fine:fineBest,
                         cards:cards, kind:"best", showPrice:true, wide:true});
  } else {
    var d=String(state.denom), node=RAW.data[mode].by_denom[d]||{best:[],avoid:[]};
    html += '<div class="view-head"><h1 class="view-title"><span class="hl">$'+d+' Scratchers</span></h1></div>';
    if(node.best && node.best.length)
      html += sectionHTML({band:BAND_BEST[mode], fig:countFig(node.best.length),
                           sub:"Today's picks", fine:fineBest, cards:node.best, kind:"best", showPrice:false});
    if(node.avoid && node.avoid.length)
      html += sectionHTML({band:"Skip These", fig:countFig(node.avoid.length),
                           sub:"Jackpot traps", fine:fineAvoid, cards:node.avoid, kind:"avoid", showPrice:false});
  }
  els.content.innerHTML=html;
}

/* ---------- draw view ---------- */
function ballRow(slip){
  var whites = slip.white_numbers.map(function(n){return '<span class="ball">'+n+'</span>';}).join("");
  var special = slip.special_number!=null
    ? '<span class="plus">+</span><span class="ball special">'+slip.special_number+'</span>' : "";
  return '<div class="pick-row">'+whites+special+'</div>';
}
function pickBlock(title, slips){
  if(!slips || !slips.length) return "";
  return '<div class="pick-block"><h4>'+title+'</h4>'+slips.map(ballRow).join("")+'</div>';
}
function gameCard(g){
  if(!g.ok) return "";
  var matrix = g.white_count+" of "+g.white_pool + (g.special_ball_name?" + "+esc(g.special_ball_name)+" of "+g.special_pool:"");
  var isAnnuity = g.game_id==="daily-grand" && g.annuity;
  var jackpotText = isAnnuity ? fmtAnnuity(g.annuity) : fmtJackpot(g.jackpot);
  var jackpotCls = "jackpot"+(isAnnuity?" jackpot-small":"");
  var extra = "";
  if(g.game_id==="lotto-649" && g.gold_ball){
    extra = '<span class="g-extra">+ Gold Ball '+fmtJackpot(g.gold_ball.jackpot)
      + (g.gold_ball.guaranteed_prize?' ('+fmtJackpot(g.gold_ball.guaranteed_prize)+' guaranteed)':'')+'</span>';
  }
  var badge = g.best_tonight
    ? '<div class="best-badge" title="Logic’s Pick — best value by published fixed prizes and tonight’s jackpots (a value ranking, not a prediction)">'
      + '<span class="b1">Logic’s<br>Pick</span><span class="b2">Best Value</span></div>'
    : "";
  return '<article class="game'+(g.best_tonight?" is-best":"")+'" id="game-'+esc(g.game_id)+'">'
    + badge
    + '<div class="strip"><h2>'+esc(g.display_name)+'</h2><span class="'+jackpotCls+'">'+jackpotText+'</span></div>'
    + '<div class="gmeta"><span><b>Next draw</b> '+esc(g.next_draw||"TBD")+'</span>'+extra
    + '<span class="g-cost">$'+g.ticket_cost+' per play</span></div>'
    + '<div class="gbody">'+pickBlock("Hot picks", g.hot)+pickBlock("Due / cold picks", g.due)
    + ((g.mix&&g.mix.length)?pickBlock("Mix picks", g.mix):"")+'</div>'
    + '<div class="window">'+matrix+' · Read from the last '+g.history_window_draws+' draws</div>'
    + '</article>';
}
function renderDraw(){
  var ordered = DRAW.games.slice().sort(function(a,b){return (b.best_tonight?1:0)-(a.best_tonight?1:0);});
  els.content.innerHTML =
    '<a class="moonshot-band" href="moonshot/">'
    + '<img class="ms-moon" src="moonshot/moonshot.png" alt="" width="800" height="632">'
    + '<span class="ms-copy"><span class="ms-title">Take a Moonshot!</span>'
    + '<span class="ms-sub">Picks by moon phase</span></span>'
    + '<span class="ms-arrow" aria-hidden="true">&rarr;</span>'
    + '</a>'
    + '<div class="view-head"><h1 class="view-title">Today’s <span class="hl">Draw Game</span> Picks</h1></div>'
    + '<div class="games-grid">'+ordered.map(gameCard).join("")+'</div>'
    + '<details class="info-toggle"><summary>Info</summary>'
    + '<section class="legend">'
    + '<div class="box"><h5>Hot picks</h5><p>'+esc(DRAW.strategies.hot)+'</p></div>'
    + '<div class="box"><h5>Due / cold picks</h5><p>'+esc(DRAW.strategies.due)+'</p></div>'
    + (DRAW.strategies.mix?'<div class="box"><h5>Mix picks</h5><p>'+esc(DRAW.strategies.mix)+'</p></div>':'')
    + '</section>'
    + '<section class="fine"><div class="box">'
    + '<h5>Read this part</h5><p>'+esc(DRAW.meaning)+'</p>'
    + '<h5>★ The gold seal</h5><p>'+esc(DRAW.best_tonight_meaning)+'</p>'
    + '</div></section>'
    + '</details>';
}

function renderContent(){
  closeSheet();
  if(state.surface==="draw") renderDraw(); else renderScratchers();
}

/* ---------- mobile tile detail sheet (phones only, #1181) ---------- */
var mqTiles = window.matchMedia ? window.matchMedia("(max-width:600px)") : null;
function openSheet(card){
  var stat = statFor(card);
  var chip = card.kind==="avoid"
    ? '<span class="sheet-chip avoid">✕ Skip this one</span>'
    : '<span class="sheet-chip best">★ Logic’s pick'+(card.rank?' #'+esc(card.rank):'')+'</span>';
  var img = card.image_url
    ? '<img src="'+esc(card.image_url)+'" alt="'+esc(card.title)+' ticket" decoding="async" onerror="this.parentNode.classList.add(\'err\')">'
    : '';
  var noArt = '<span class="sheet-noart">'+esc(card.title)+'</span>';
  els.sheet.innerHTML =
    '<div class="sheet-art'+(card.image_url?'':' err')+'">'+img+noArt+'<button class="sheet-x" type="button" aria-label="Close">✕</button></div>'
    + '<div class="sheet-body">'
    + '<div class="sheet-head"><div class="sheet-title" id="sheetTitle">'+esc(card.title)+'</div>'
    + '<span class="denom-bub" title="$'+esc(card.price)+' ticket">$'+esc(card.price)+'</span></div>'
    + chip
    + (stat
        ? '<div class="sheet-stat"><span class="sheet-stat-v">'+esc(stat.v)+'</span><span class="sheet-stat-l">'+esc(stat.l)+'</span>'
          + (stat.badge?'<div class="stat-badge" title="'+esc(stat.badgeTitle)+'">'+esc(stat.badge)+'</div>':'')
          + (stat.s?'<div class="sheet-stat-s">'+esc(stat.s)+'</div>':'')
          + (stat.s2?'<div class="sheet-stat-s">'+esc(stat.s2)+'</div>':'')
          + (stat.s3?'<div class="sheet-stat-s sheet-stat-muted">'+esc(stat.s3)+'</div>':'')
          + '</div>'
        : '<div class="sheet-stat"><span class="sheet-stat-v stat-none">n/a</span></div>')
    + '<p class="sheet-reason">'+esc(card.reason)+'</p>'
    + '</div>';
  els.sheet.classList.add("open");
  els.sheetBackdrop.classList.add("open");
  els.sheet.setAttribute("aria-hidden","false");
  document.body.classList.add("sheet-open");
  els.sheet.scrollTop = 0;
}
function closeSheet(){
  if(!els.sheet || !els.sheet.classList.contains("open")) return;
  els.sheet.classList.remove("open");
  els.sheetBackdrop.classList.remove("open");
  els.sheet.setAttribute("aria-hidden","true");
  document.body.classList.remove("sheet-open");
}
els.content.addEventListener("click",function(e){
  if(!mqTiles || !mqTiles.matches) return;   /* phones only */
  if(state.surface!=="scratchers") return;
  var row=e.target.closest(".row");
  if(!row || row.dataset.ti==null) return;
  var card=tileCards[+row.dataset.ti];
  if(card) openSheet(card);
});
els.sheetBackdrop.addEventListener("click",closeSheet);
els.sheet.addEventListener("click",function(e){ if(e.target.closest(".sheet-x")) closeSheet(); });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeSheet(); });
if(mqTiles && mqTiles.addEventListener){
  mqTiles.addEventListener("change",function(m){ if(!m.matches) closeSheet(); });
}

/* ---------- collapsible controls: denom rail + mode panel behind the SORT BY tab (#1181) ---------- */
function closeControls(){
  document.body.classList.remove("controls-open");
  els.controlsTab.setAttribute("aria-expanded","false");
}
els.controlsTab.addEventListener("click",function(){
  var open=document.body.classList.toggle("controls-open");
  els.controlsTab.setAttribute("aria-expanded", open?"true":"false");
  if(open) window.scrollTo({top:0});
});

/* ---------- chrome ---------- */
function renderChrome(){
  var onDraw = state.surface==="draw";
  document.body.classList.toggle("on-draw", onDraw);
  els.modebar.style.display = onDraw ? "none" : "";
  Array.prototype.forEach.call(els.surfaceToggle.querySelectorAll(".surface-btn"),function(b){
    var on=b.dataset.surface===state.surface;
    b.classList.toggle("active",on); b.setAttribute("aria-pressed",on);
  });
  if(!onDraw){
    var m=RAW.modes.find(function(x){return x.key===state.mode;});
    els.modeBlurb.textContent=m.blurb;
    els.modeTriggerCurrent.textContent=m.label;
    els.controlsTabLabel.textContent=(state.denom==="overall"?"All":"$"+state.denom)+" · "+m.label;
    Array.prototype.forEach.call(els.modeBtns.children,function(b){
      var on=b.dataset.mode===state.mode;
      b.classList.toggle("active",on); b.setAttribute("aria-pressed",on);
    });
  }
  var best=onDraw?[]:((RAW.topbar[state.mode]||{}).best_denoms||[]);
  Array.prototype.forEach.call(els.railNav.children,function(item){
    var key=onDraw?item.dataset.game:item.dataset.denom;
    var want=onDraw?String(state.game):String(state.denom);
    var on=key===want;
    item.classList.toggle("active",on);
    if(on) item.setAttribute("aria-current","page"); else item.removeAttribute("aria-current");
    var dot=item.querySelector(".nav-dot");
    if(dot) dot.classList.toggle("on", !onDraw && best.indexOf(Number(item.dataset.denom))>=0);
  });
}
function renderAll(){ renderChrome(); renderContent(); }

/* ---------- rail nav ---------- */
function buildNav(){
  var html="";
  if(state.surface==="scratchers"){
    html += '<button class="nav-item" data-denom="overall" title="Overall">All</button>';
    RAW.denominations.forEach(function(d){
      html += '<button class="nav-item" data-denom="'+d+'" title="$'+d+' Scratchers">$'+d
        + '<span class="nav-dot" aria-hidden="true"></span></button>';
    });
  } else {
    DRAW.games.forEach(function(g){
      if(!g.ok) return;
      html += '<button class="nav-item" data-game="'+esc(g.game_id)+'" title="'+esc(g.display_name)+'">'
        + esc(GAME_ABBR[g.game_id]||g.display_name.slice(0,2).toUpperCase())+'</button>';
    });
  }
  els.railNav.innerHTML=html;
}
els.railNav.addEventListener("click",function(e){
  var item=e.target.closest(".nav-item"); if(!item) return;
  if(state.surface==="scratchers"){
    state.denom=item.dataset.denom;
    closeControls();
    renderAll();
    window.scrollTo({top:0});
  } else {
    state.game=item.dataset.game;
    renderChrome();
    var card=document.getElementById("game-"+state.game);
    if(card) card.scrollIntoView({block:"start"});
  }
});

/* ---------- mode switcher ---------- */
function buildModes(){
  els.modeBtns.innerHTML = RAW.modes.map(function(m){
    return '<button class="mode-btn" data-mode="'+m.key+'">'+esc(m.label)+'</button>';
  }).join("");
  els.modeBtns.addEventListener("click",function(e){
    var b=e.target.closest(".mode-btn"); if(!b) return;
    state.mode=b.dataset.mode;
    els.modebar.classList.remove("open");
    els.modeTrigger.setAttribute("aria-expanded","false");
    closeControls();
    renderAll();
  });
  els.modeTrigger.addEventListener("click",function(){
    var open=els.modebar.classList.toggle("open");
    els.modeTrigger.setAttribute("aria-expanded", open?"true":"false");
  });
}

function buildTipFoot(){
  var t=RAW.tip_block;
  els.tip.innerHTML='<span class="tip-line">'+esc(t.line)+'</span>'
    + '<a class="tip-btn" href="'+esc(t.button_href)+'" target="_blank" rel="noopener">'+esc(t.button_label)+'</a>'
    + '<span class="tip-note">'+esc(t.note)+'</span>';
  els.foot.innerHTML='<div>'+esc(RAW.footer_text)+'</div><div class="num-fig">'+esc(RAW.disclaimer)+'</div>'
    + (RAW.as_of_text?'<div class="num-fig">'+esc(RAW.as_of_text)+'</div>':'')
    + '<div class="scratch-stripe" aria-hidden="true"></div>'
    + '<div class="rg-line">Play responsibly · <a href="https://www.playnow.com/gamesense/" target="_blank" rel="noopener">GameSense</a> · 1-888-795-6111 · <a href="https://www.gamblingsupportbc.ca" target="_blank" rel="noopener">gamblingsupportbc.ca</a></div>';
  els.dateline.textContent=RAW.generated_at;
}

/* ---------- surface toggle ---------- */
els.surfaceToggle.addEventListener("click",function(e){
  var b=e.target.closest(".surface-btn"); if(!b || b.style.display==="none") return;
  if(b.dataset.surface===state.surface) return;
  state.surface=b.dataset.surface;
  buildNav();
  renderAll();
  window.scrollTo({top:0});
});

/* ---------- boot ---------- */
var anyDrawOk = DRAW.games.some(function(g){return g.ok;});
if(!anyDrawOk){
  var drawBtn = els.surfaceToggle.querySelector('[data-surface="draw"]');
  if(drawBtn){ drawBtn.style.display="none"; }
}
buildNav(); buildModes(); buildTipFoot();
renderAll();
})();
</script>
<script>
// visit beacon — every hit, skip bots, fail silent (same shape as /lotto/)
try {
  const ua = navigator.userAgent.toLowerCase();
  if (!/bot|crawler|spider|preview|facebookexternal|slackbot|twitterbot|linkedinbot|whatsapp|discordbot/.test(ua)) {
    fetch('/beacon', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        page: 'bclotto',
        ref: document.referrer || 'direct',
        tag: 'maple_leaf'
      })
    }).catch(() => {});
  }
} catch (e) {}
</script>
</body>
</html>
