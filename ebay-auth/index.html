<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Logic's Loot: eBay sign-in</title>
<style>
  :root { color-scheme: light; --ink: #1a1a1a; --soft: #666; --paper: #fffdf7; --accent: #d4541e; --ok: #1f7a3a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 16px; background: var(--paper); color: var(--ink); font: 18px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 18px; }
  p { margin: 0 0 14px; }
  .code { display: block; width: 100%; padding: 14px 16px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; font: 15px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; margin: 10px 0 14px; }
  button { font: inherit; font-weight: 600; padding: 14px 22px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
  button.ok { background: var(--ok); }
  .soft { color: var(--soft); font-size: 15px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1 id="h">eBay sign-in</h1>
  <div id="good" hidden>
    <p>eBay said yes. Copy this code and tell Claude <b>code copied</b>.</p>
    <code class="code" id="code"></code>
    <button type="button" id="copy">Copy code</button>
    <p class="soft" id="exp"></p>
  </div>
  <div id="bad" hidden>
    <p>eBay did not hand back a code.</p>
    <p class="soft" id="why"></p>
  </div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = q.get("code"), exp = q.get("expires_in");
  if (code) {
    document.getElementById("good").hidden = false;
    document.getElementById("code").textContent = code;
    if (exp) document.getElementById("exp").textContent = "Good for about " + Math.round(parseInt(exp, 10) / 60) + " minutes.";
    document.getElementById("copy").addEventListener("click", function () {
      var b = this, done = function () { b.textContent = "Copied"; b.classList.add("ok"); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, function () { fallback(); done(); });
      else { fallback(); done(); }
    });
  } else {
    document.getElementById("bad").hidden = false;
    var why = q.get("error_description") || q.get("error") || (q.get("declined") ? "You pressed Decline. Go back and press Agree." : "Open this page from the eBay sign-in link, not on its own.");
    document.getElementById("why").textContent = why;
  }
  function fallback() { var ta = document.createElement("textarea"); ta.value = code; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.focus(); ta.select(); try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(ta); }
})();
</script>
</body>
</html>
