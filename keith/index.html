<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wadhams Construction | Pick Your Website</title>
<meta name="description" content="Wadhams Construction, San Diego. Two websites, same guy, same license. CSLB #441195, active since 1983.">
<meta property="og:title" content="Wadhams Construction | Pick Your Website">
<meta property="og:description" content="Two websites. Same guy. Same license. CSLB #441195, active since 1983.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://roblogic.org/keith/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Anton&family=Special+Elite&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --ink: #0f1113;
  --text: #f2f0eb;
  --dim: #b8b4ab;
  --amber: #f5a300;
  --paper: #f4eeDC;
  --toner: #1b1713;
  --marker: #c23b22;
  --tape: rgba(214,196,148,.75);
}
body {
  background: var(--ink);
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  font-family: 'Barlow', sans-serif;
}

.bar {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: .4rem 1.1rem;
  flex-wrap: wrap;
  padding: .8rem 1rem;
  border-bottom: 1px solid rgba(242,240,235,.14);
  font-family: 'IBM Plex Mono', monospace;
  font-size: .78rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--dim);
  text-align: center;
}
.bar b { color: var(--text); font-weight: 500; }
.bar .d { color: var(--amber); }

.doors {
  flex: 1;
  display: flex;
  position: relative;
  min-height: 0;
}

.door {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 1.1rem;
  padding: 3rem clamp(1.2rem, 4vw, 3.5rem);
  text-decoration: none;
  position: relative;
  overflow: hidden;
  transition: flex-grow .35s ease;
}
@media (prefers-reduced-motion: no-preference) {
  .door:hover, .door:focus-visible { flex-grow: 1.18; }
}
.door:focus-visible { outline: 3px solid var(--amber); outline-offset: -3px; }

/* left door: the pro site */
.door-pro {
  background: url('img/framing-wall.jpg') center 30% / cover no-repeat;
}
.door-pro::before {
  content: '';
  position: absolute; inset: 0;
  background: rgba(15,17,19,.78);
  transition: background .35s ease;
}
.door-pro:hover::before, .door-pro:focus-visible::before { background: rgba(15,17,19,.62); }
.door-pro > * { position: relative; }
.door-pro .kicker {
  font-family: 'IBM Plex Mono', monospace;
  color: var(--amber);
  font-size: .8rem;
  letter-spacing: .24em;
  text-transform: uppercase;
}
.door-pro h2 {
  font-family: 'Archivo Black', sans-serif;
  color: var(--text);
  text-transform: uppercase;
  font-size: clamp(1.6rem, 3.4vw, 2.7rem);
  line-height: 1.02;
  max-width: 14ch;
}
.door-pro p {
  color: var(--dim);
  font-size: clamp(.95rem, 1.4vw, 1.1rem);
  font-weight: 500;
  max-width: 34ch;
}
.door-pro .go {
  margin-top: .6rem;
  font-weight: 600;
  font-size: .95rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--amber);
  border: 1px solid rgba(245,163,0,.55);
  padding: .8rem 1.5rem;
  transition: background .2s ease, color .2s ease;
}
.door-pro:hover .go { background: var(--amber); color: #171204; }

/* right door: the flyer */
.door-jamul {
  background:
    repeating-linear-gradient(125deg, rgba(27,23,19,.028) 0 1px, transparent 1px 5px),
    var(--paper);
}
.door-jamul::after {
  content: '';
  position: absolute;
  top: -14px; left: 50%;
  width: 120px; height: 34px;
  transform: translateX(-50%) rotate(-2deg);
  background: var(--tape);
  box-shadow: 0 1px 2px rgba(27,23,19,.18);
}
.door-jamul .kicker {
  font-family: 'Special Elite', monospace;
  color: #6d655a;
  font-size: .85rem;
  letter-spacing: .2em;
  text-transform: uppercase;
}
.door-jamul h2 {
  font-family: 'Anton', sans-serif;
  color: var(--toner);
  text-transform: uppercase;
  font-size: clamp(1.7rem, 3.6vw, 2.9rem);
  line-height: .98;
  letter-spacing: .01em;
  max-width: 15ch;
  text-shadow: 1.5px 1.5px 0 rgba(27,23,19,.12);
}
.door-jamul .his {
  font-family: 'Permanent Marker', cursive;
  color: var(--marker);
  font-size: 1.15rem;
  transform: rotate(-2deg);
}
.door-jamul .go {
  margin-top: .6rem;
  font-family: 'Special Elite', monospace;
  font-size: .95rem;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--paper);
  background: var(--toner);
  padding: .85rem 1.5rem;
  transition: background .2s ease;
}
.door-jamul:hover .go { background: var(--marker); }

/* center seam badge */
.pick {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
  width: 86px; height: 86px;
  border-radius: 50%;
  background: var(--ink);
  border: 2px solid var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'IBM Plex Mono', monospace;
  font-size: .72rem;
  letter-spacing: .18em;
  color: var(--text);
  text-align: center;
  line-height: 1.35;
  pointer-events: none;
}

@media (max-width: 760px) {
  .doors { flex-direction: column; }
  .door { min-height: 46svh; padding: 3.2rem 1.4rem; }
  .pick { width: 72px; height: 72px; font-size: .64rem; }
  .door-jamul::after { display: none; }
}
</style>
</head>
<body>

<header class="bar">
  <span><b>WADHAMS CONSTRUCTION</b></span><span class="d">◆</span>
  <span>San Diego</span><span class="d">◆</span>
  <span>CSLB #441195</span><span class="d">◆</span>
  <span>Same guy, two websites</span>
</header>

<main class="doors">
  <a class="door door-pro" href="pro/" aria-label="View the professional Wadhams Construction site">
    <span class="kicker">Option 1</span>
    <h2>The Professional One</h2>
    <p>Licensed general contractor. Tenant improvements, ADA retrofits, residential and commercial.</p>
    <span class="go">View site</span>
  </a>

  <div class="pick" aria-hidden="true">PICK<br>ONE</div>

  <a class="door door-jamul" href="jamul/" aria-label="View the flyer: that piece of shit carpenter from Jamul">
    <span class="kicker">Option 2</span>
    <h2>That Piece of Shit Carpenter from Jamul</h2>
    <span class="his">his words</span>
    <span class="go">View flyer</span>
  </a>
</main>

</body>
</html>
