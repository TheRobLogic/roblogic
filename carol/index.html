<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Discovery questions</title>
<style>
  [hidden] { display: none !important; }
  body {
    margin: 0;
    padding: 2rem 1.25rem 3rem;
    background: #fff;
    color: #111;
    font: 18px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 36rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 .5rem; }
  ol { padding-left: 1.5rem; margin: 1.5rem 0; }
  li { margin: 0 0 1.5rem; padding-left: .25rem; }
  label { display: block; margin: 0 0 .4rem; }
  textarea, input[type="text"] {
    display: block;
    width: 100%;
    box-sizing: border-box;
    margin: 0;
    padding: .55rem .7rem;
    border: 1px solid #aaa;
    border-radius: 6px;
    background: #fff;
    color: #111;
    font: inherit;
  }
  textarea { min-height: 3.4em; resize: vertical; }
  textarea:focus, input[type="text"]:focus { outline: 2px solid #111; outline-offset: 1px; border-color: #111; }
  .button {
    display: inline-block;
    padding: .8rem 1.4rem;
    border: 0;
    border-radius: 6px;
    background: #111;
    color: #fff;
    font: inherit;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .button:disabled { opacity: .5; cursor: default; }
  .note { color: #555; font-size: .95rem; }
  .problem { color: #a00; }
  .trap { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
  <main>
    <h1>Discovery questions</h1>
    <p>Rough answers are fine.</p>

    <form id="answers" novalidate>
      <ol>
        <li><label for="q1">What's the practice called, and where's the office? If there's more than one location, list them all.</label><textarea id="q1" rows="2"></textarea></li>
        <li><label for="q2">How many people are in the practice, and how many of them would use the shared drive? Does anyone work from home or see clients by video?</label><textarea id="q2" rows="2"></textarea></li>
        <li><label for="q3">What would go on the drive: client files and session notes, or office stuff like forms, billing and HR? Both?</label><textarea id="q3" rows="2"></textarea></li>
        <li><label for="q4">Do you already use a notes or scheduling system like SimplePractice or TherapyNotes? What lives in there?</label><textarea id="q4" rows="2"></textarea></li>
        <li><label for="q5">Do you bill insurance? Electronically?</label><textarea id="q5" rows="2"></textarea></li>
        <li><label for="q6">What do you use for email today (Gmail, Outlook, something else), and what comes after the @ in your work email address?</label><textarea id="q6" rows="2"></textarea></li>
        <li><label for="q7">What computers do people use? Practice-owned or personal, Mac or Windows?</label><textarea id="q7" rows="2"></textarea></li>
        <li><label for="q8">Where do documents live right now, and how do you share them with each other?</label><textarea id="q8" rows="2"></textarea></li>
        <li><label for="q9">Is there a printer now, and how do people print to it? Do you need to scan or fax too?</label><textarea id="q9" rows="2"></textarea></li>
        <li><label for="q10">Do you have your own internet and Wi-Fi, or is it shared with the building? Who's the provider, and who set it up?</label><textarea id="q10" rows="2"></textarea></li>
        <li><label for="q11">Has anyone done a HIPAA risk assessment or written security policies for the practice? Does your malpractice or business insurance ask for anything on that?</label><textarea id="q11" rows="2"></textarea></li>
        <li><label for="q12">After it's set up, do you want someone on call and managing it month to month, or a one-time setup you run yourselves?</label><textarea id="q12" rows="2"></textarea></li>
        <li><label for="q13">Any timeline, and is there something that prompted this now (a move, a new hire, insurance, something that went wrong)?</label><textarea id="q13" rows="2"></textarea></li>
      </ol>

      <div class="trap" aria-hidden="true">
        <label for="hpx">Leave this empty</label>
        <input type="text" id="hpx" tabindex="-1" autocomplete="off">
      </div>

      <p><button type="submit" class="button" id="send">Send answers</button></p>
      <p class="note" id="status" role="status" aria-live="polite"></p>
    </form>

    <div id="sent" hidden>
      <p><strong>Sent.</strong> Thank you.</p>
    </div>

    <div id="fallback" hidden>
      <p class="problem">That didn't go through. Tap below to email your answers instead. They're already filled in.</p>
      <p><a class="button" id="mail" href="#">Email your answers</a></p>
      <p class="note">If that doesn't open your email, copy your answers from here:</p>
      <textarea id="copytext" rows="8" readonly></textarea>
    </div>

    <!--email_off-->
    <p class="note">Or email <a href="mailto:roblogic@gmail.com">roblogic@gmail.com</a>.</p>
    <!--/email_off-->
  </main>

  <script data-cfasync="false">
  (function () {
    var ENDPOINT = 'https://n8n.roblogic.org/webhook/carol-discovery';
    var ADDRESS = ['roblogic', 'gmail.com'].join('@');
    var DRAFT = 'carol-discovery-draft';
    var test = /[?&]test=1(&|$)/.test(location.search);

    var form = document.getElementById('answers');
    var send = document.getElementById('send');
    var status = document.getElementById('status');
    var boxes = Array.prototype.slice.call(form.querySelectorAll('textarea'));

    function grow(el) {
      if (el.tagName !== 'TEXTAREA') return;
      el.style.height = 'auto';
      el.style.height = (el.scrollHeight + 2) + 'px';
    }

    function saveDraft() {
      try {
        var draft = {};
        boxes.forEach(function (el) { if (el.value) draft[el.id] = el.value; });
        localStorage.setItem(DRAFT, JSON.stringify(draft));
      } catch (e) {}
    }

    function loadDraft() {
      try {
        var draft = JSON.parse(localStorage.getItem(DRAFT) || '{}');
        boxes.forEach(function (el) {
          if (draft[el.id]) { el.value = draft[el.id]; grow(el); }
        });
      } catch (e) {}
    }

    function collect() {
      return Array.prototype.map.call(form.querySelectorAll('ol li'), function (li) {
        return {
          q: li.querySelector('label').textContent.trim(),
          a: li.querySelector('textarea').value.trim()
        };
      });
    }

    function answersText(answers) {
      var parts = [];
      answers.forEach(function (x, i) {
        if (x.a) parts.push((i + 1) + '. ' + x.q + '\n' + x.a);
      });
      return parts.join('\n\n');
    }

    function emailLink(text) {
      return 'mailto:' + ADDRESS +
        '?subject=' + encodeURIComponent('Discovery answers') +
        '&body=' + encodeURIComponent(text.replace(/\r?\n/g, '\r\n'));
    }

    loadDraft();
    form.addEventListener('input', function (e) { grow(e.target); saveDraft(); });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var answers = collect();
      if (!answers.some(function (x) { return x.a; })) {
        status.textContent = 'Answer at least one question first.';
        return;
      }

      send.disabled = true;
      status.textContent = 'Sending...';
      document.getElementById('fallback').hidden = true;

      var controller = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function () { if (controller) controller.abort(); }, 20000);

      fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          answers: answers,
          hpx: document.getElementById('hpx').value,
          test: test
        }),
        signal: controller ? controller.signal : undefined
      })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (!data || data.ok !== true) throw new Error('not saved');
          clearTimeout(timer);
          try { localStorage.removeItem(DRAFT); } catch (e) {}
          form.hidden = true;
          document.getElementById('sent').hidden = false;
          window.scrollTo(0, 0);
        })
        .catch(function () {
          clearTimeout(timer);
          send.disabled = false;
          status.textContent = '';
          var text = answersText(answers);
          document.getElementById('mail').href = emailLink(text);
          var copy = document.getElementById('copytext');
          copy.value = text;
          var fallback = document.getElementById('fallback');
          fallback.hidden = false;
          fallback.scrollIntoView({ block: 'center' });
        });
    });
  })();
  </script>
</body>
</html>
